<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LEGIT — Verified people. Zero bullsh*t.</title>
<meta name="theme-color" content="#060607">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060607;--card:#101013;--line:#25252b;--red:#e8112d;--chrome:#c8ccd4;--green:#16d96f;--amber:#f5b301;--txt:#f2f2f4;--dim:#8d8d97}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.h{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:16px 16px 90px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer;width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--chrome)}.btn.small{width:auto;padding:8px 12px;font-size:13px}
.btn.green{background:var(--green);color:#000}.btn:disabled{opacity:.5}
input,select,textarea{width:100%;background:#0b0b0d;border:1px solid var(--line);border-radius:10px;padding:12px;margin:5px 0 10px;outline:none}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--chrome);outline-offset:2px}
label{font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.dim{color:var(--dim)}.red{color:var(--red)}.green{color:var(--green)}.err{color:#ff6b7d;margin:8px 0}.ok{color:var(--green);margin:8px 0}
.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 10px;margin:2px 4px 2px 0;font-size:12px;color:var(--chrome)}
.tag.on{background:var(--red);border-color:var(--red);color:#fff}
.badge{background:#0d2e1c;color:var(--green);border:1px solid #14522f;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:800}
nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0cee;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
nav div{display:flex;max-width:520px;width:100%}nav button{flex:1;background:none;border:0;padding:12px 2px 10px;color:var(--dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;position:relative}
nav button.on{color:var(--red)}nav .dot{position:absolute;top:6px;right:22%;background:var(--red);color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
.pill{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:11px;letter-spacing:.08em;border-radius:99px;padding:5px 12px;margin-bottom:10px}.feat .card{margin-bottom:10px}.hero{text-align:center;padding:30px 0 10px}.hero h1{font-size:54px;color:var(--red);line-height:1}.hero p{color:var(--chrome)}
.swipe{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:3/4;border:1px solid var(--line)}
.swipe img{width:100%;height:100%;object-fit:cover}.swipe .info{position:absolute;left:0;right:0;bottom:0;padding:60px 16px 14px;background:linear-gradient(transparent,#000d)}
.row{display:flex;gap:10px}.row>*{flex:1}.sp{margin-top:12px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--chrome);cursor:pointer;text-transform:capitalize}.chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;background:#222;color:var(--chrome);border-radius:6px;padding:3px 7px}textarea.wmt{width:100%}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.msg{max-width:80%;padding:9px 12px;border-radius:14px;margin:6px 0;word-wrap:break-word}.msg.me{background:var(--red);margin-left:auto;border-bottom-right-radius:4px}.msg.them{background:#1b1b20;border-bottom-left-radius:4px}
.fuse{font-weight:800;font-variant-numeric:tabular-nums}.fuse.g{color:var(--green)}.fuse.n{color:var(--amber)}.fuse.r{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.fuse.r{animation:none;text-decoration:underline}}
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#222;flex:none}.list{display:flex;gap:12px;align-items:center;cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:78px;height:78px;border-radius:10px;object-fit:cover}
.sheet{position:fixed;inset:0;background:#000c;display:flex;align-items:flex-end;justify-content:center;z-index:20}.sheet>div{background:var(--card);border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:520px;max-height:88vh;overflow:auto}
pre.snap{white-space:pre-wrap;background:#0b0b0d;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;max-height:160px;overflow:auto}
</style></head><body>
<div id="app" aria-live="polite"></div><footer id="ft" style="text-align:center;padding:6px 0 30px;color:var(--dim);font-size:11px"><img src="/potent-griffin-icon.png" alt="POTENT&reg;" style="height:20px;width:20px;vertical-align:middle;margin-right:6px;opacity:.7"><span id="cp" style="user-select:none;-webkit-user-select:none">&copy; 2026 POTENT&reg; &middot; LEGIT &middot; All Rights Reserved</span> &middot; <a href="/legit/terms.html" style="color:var(--dim)">Terms</a> &middot; <a href="/legit/privacy.html" style="color:var(--dim)">Privacy</a></footer><nav id="nav" hidden><div id="navin"></div></nav>
<script src="/google-signin.js"></script>
<script>
var API="/.netlify/functions/legit-api", TK="legit_token", S={user:null,access:null,tab:"discover",intentions:[],complete:false,pendingLB:0,unread:0};
var $=function(s){return document.querySelector(s)}, app=$("#app");
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function tok(){try{return localStorage.getItem(TK)||""}catch(e){return ""}}
function setTok(t){try{t?localStorage.setItem(TK,t):localStorage.removeItem(TK)}catch(e){}}
async function api(action,body){
  try{var r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok()},body:JSON.stringify(Object.assign({action:action},body||{}))});
    var d=await r.json().catch(function(){return {ok:false,error:"Server error"}});
    if(d.login){setTok("");S.user=null;auth();return d}
    if(d.access&&d.access!==S.access&&r.status===403){S.access=d.access;route()}
    return d}catch(e){return {ok:false,error:"No connection."}}}
var timers=[];function clearTimers(){timers.forEach(clearInterval);timers=[]}
function fuseHTML(exp){var ms=new Date(exp)-Date.now();if(ms<=0)return '<span class="fuse r">expired</span>';var h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);var c=ms>12*36e5?"g":ms<6*36e5?"r":"n";return '<span class="fuse '+c+'" data-exp="'+exp+'">'+("0"+h).slice(-2)+":"+("0"+m).slice(-2)+":"+("0"+s).slice(-2)+'</span>'}
function tickFuses(){clearTimers();timers.push(setInterval(function(){document.querySelectorAll(".fuse[data-exp]").forEach(function(el){el.outerHTML=fuseHTML(el.dataset.exp)})},1000))}

/* ---------- auth ---------- */
function auth(mode){mode=mode||"signup";clearTimers();$("#nav").hidden=true;
  app.innerHTML='<div class="hero"><div class="pill">🔥 THE FIRST EVER SCAMMER-PROOF DATING APP</div><h1>LEGIT</h1><p style="font-size:18px;font-weight:800;color:#fff">Verified people. Verified intentions.<br>Zero bullsh*t.</p><p class="dim" style="max-width:420px;margin:10px auto 0">No catfish. No bots. No romance scammers. No "text me on WhatsApp." If you\'re in here, an ID says you\'re real.</p></div>'+
  (mode=="signup"?'<div class="feat"><div class="card"><b>🪪 ID or you don\'t get in</b><br><span class="dim">Government ID and a selfie before you see a single profile. Nobody skips the line.</span></div><div class="card"><b>🚫 No filters. No catfishing.</b><br><span class="dim">Real face, real age. We don\'t want to date the dog-ears version of you. If your photo needs a filter to look like you, it doesn\'t belong here.</span></div><div class="card"><b>🛑 Scammers can\'t run their script</b><br><span class="dim">Phone numbers, emails, Insta and Snap get blocked automatically. Three tries and you\'re out for good.</span></div><div class="card"><b>⏳ 24 hours or the match dies</b><br><span class="dim">Send a real opener or lose them. "Hey" doesn\'t count.</span></div><div class="card"><b>🧠 No game? Wingman has you.</b><br><span class="dim">Gentlemen: stuck on what to say? Our AI wingman writes it with you. No more "hey."</span></div><div class="card"><b>💵 $39.99. Once. Forever.</b><br><span class="dim">24 hours free after you verify. No subscription. No premium tiers.</span></div><p class="dim" style="text-align:center;font-size:12px">Not for catfish, bots, filter-faces, or anyone whose whole personality is "hey."</p></div>':'')+'<div class="card">'+
  '<div class="row sp"><button class="btn '+(mode=="signup"?"":"ghost")+'" id="m1">Join</button><button class="btn '+(mode=="login"?"":"ghost")+'" id="m2">Log in</button></div><div class="sp"></div>'+
  (mode=="signup"?'<label for="n">First name</label><input id="n" autocomplete="given-name"><label for="ag">Age (18+)</label><input id="ag" type="number" min="18" max="99" inputmode="numeric">':'')+
  '<label for="e">Email</label><input id="e" type="email" autocomplete="email"><label for="p">Password (8+ characters)</label><input id="p" type="password" autocomplete="'+(mode=="signup"?"new-password":"current-password")+'">'+
  (mode=="signup"?'<label style="text-transform:none;font-size:13px;display:flex;gap:8px;align-items:flex-start;letter-spacing:0"><input type="checkbox" id="ag2" style="width:auto;margin:3px 0 0"><span>I am 18 or older and agree to the <a href="/legit/terms.html" target="_blank" style="color:var(--red)">Terms of Service</a> and <a href="/legit/privacy.html" target="_blank" style="color:var(--red)">Privacy Policy</a>, including that messages are scanned and may be reviewed by LEGIT for safety.</span></label>':'')+'<div id="er" class="err" role="alert"></div><button class="btn" id="go">'+(mode=="signup"?"Create account":"Log in")+'</button>'+
  '<div id="gg" style="margin:12px 0 0;display:flex;justify-content:center"></div>'+
  (mode=="signup"?'<p class="dim" style="font-size:12px">Next you verify your ID. No ID, no entry. Adults 18+ only. One-time $39.99 after your free 24 hours. No subscription.</p>':'')+'</div>';
  $("#m1").onclick=function(){auth("signup")};$("#m2").onclick=function(){auth("login")};
  if(window.PotentGoogle)PotentGoogle.mount($("#gg"),{endpoint:"/.netlify/functions/legit-api",action:"google",
    extra:function(){return mode=="signup"?{name:$("#n").value,age:$("#ag").value,agree:$("#ag2").checked}:{}},
    onError:function(m){$("#er").textContent=m},
    onResult:function(d){if(d.ok){setTok(d.token);boot()}else if(d.need_signup){if(mode!="signup"){auth("signup");$("#er").textContent="New here? Add your first name and age, tick the Terms box, then tap Continue with Google again."}else $("#er").textContent=d.error}}});
  $("#go").onclick=async function(){$("#go").disabled=true;var d=await api(mode,{name:mode=="signup"?$("#n").value:undefined,age:mode=="signup"?$("#ag").value:undefined,agree:mode=="signup"?$("#ag2").checked:undefined,email:$("#e").value,password:$("#p").value});
    if(d.ok){setTok(d.token);boot()}else{$("#er").textContent=d.error||"Try again.";$("#go").disabled=false}}}

/* ---------- gates ---------- */
function gateVerify(){app.innerHTML='<div class="hero"><h1>Verify to enter</h1></div><div class="card"><p>LEGIT only has verified humans. Scan your ID and take a quick selfie with Stripe. We keep the result, never your ID photo.</p><p class="dim" style="font-size:13px">Until you verify, nothing else in the app is open. After you verify you get <b>24 hours of full access</b>.</p><div id="er" class="err"></div><button class="btn" id="v">Verify my ID</button><button class="btn ghost sp" id="lo">Log out</button></div>';
  $("#v").onclick=async function(){$("#v").disabled=true;var d=await api("verify_start");if(d.url)location.href=d.url;else{$("#er").textContent=d.error||"Could not start.";$("#v").disabled=false}};$("#lo").onclick=function(){setTok("");auth("login")}}
function gatePay(){app.innerHTML='<div class="hero"><h1>Your 24 hours are up</h1></div><div class="card"><p>Unlock LEGIT once. <b>$39.99, one time.</b> No subscription, no premium tiers, no upcharges. Everyone gets everything.</p><div id="er" class="err"></div><button class="btn" id="b">Unlock for $39.99</button><button class="btn ghost sp" id="lo">Log out</button></div>';
  $("#b").onclick=async function(){$("#b").disabled=true;var d=await api("checkout");if(d.url)location.href=d.url;else{$("#er").textContent=d.error||"Could not start.";$("#b").disabled=false}};$("#lo").onclick=function(){setTok("");auth("login")}}
function gateBan(){app.innerHTML='<div class="hero"><h1>Account locked</h1></div><div class="card"><p>This account is locked. If you think it was a mistake, email <b>potentlogistics@proton.me</b> and an admin will review it.</p><button class="btn ghost" id="lo">Log out</button></div>';$("#lo").onclick=function(){setTok("");auth("login")}}

/* ---------- shell ---------- */
async function boot(){
  var q=new URLSearchParams(location.search);
  if(!tok()){auth();return}
  if(q.get("paid")&&q.get("session_id")){await api("pay_status",{session_id:q.get("session_id")})}
  if(q.get("verified")){await api("verify_status")}
  if(q.get("paid")||q.get("verified")||q.get("canceled"))history.replaceState(null,"","/legit/");
  var d=await api("me");if(!d.ok)return;S.user=d.user;S.access=d.access;S.complete=d.complete;S.intentions=d.intentions;route()}
function route(){clearTimers();
  if(S.access=="banned")return gateBan();if(S.access=="verify")return gateVerify();if(S.access=="paywall")return gatePay();if(S.access!="ok")return auth("login");
  var tabs=[["discover","Discover"],["matches","Matches"],["love","Love Board"],["wingman","Wingman"],["activity","Activity"],["profile","Profile"]];if(S.user.is_admin)tabs.push(["admin","Admin"]);
  $("#nav").hidden=false;$("#navin").innerHTML=tabs.map(function(t){return '<button class="'+(S.tab==t[0]?"on":"")+'" data-t="'+t[0]+'">'+t[1]+(t[0]=="activity"&&S.unread?'<span class="dot">'+S.unread+'</span>':'')+'</button>'}).join("");
  document.querySelectorAll("#navin button").forEach(function(b){b.onclick=function(){S.tab=b.dataset.t;route()}});
  if(!S.complete&&!S.user.is_admin&&S.tab!="profile"){S.tab="profile";return route()}
  ({discover:discover,matches:matches,love:love,wingman:wingmanTab,activity:activity,profile:profile,admin:admin})[S.tab]()}

/* ---------- discover ---------- */
var D={cards:[],filter:""};
async function discover(){app.innerHTML='<div class="bar"><h2>Discover</h2><select id="fi" style="width:auto;margin:0"><option value="">Any tonight</option>'+S.intentions.map(function(t){return '<option'+(D.filter==t?" selected":"")+'>'+esc(t)+'</option>'}).join("")+'</select></div><div id="stack" class="dim">Loading...</div>';
  $("#fi").onchange=function(){D.filter=this.value;discover()};
  var d=await api("discover",{intention:D.filter});if(!d.ok)return $("#stack").textContent=d.error||"Error";D.cards=d.cards;showCard()}
function showCard(){var c=D.cards[0],st=$("#stack");if(!c){st.innerHTML='<div class="card" style="text-align:center">No one new right now.<br><span class="dim">Widen your filters in Profile or check back soon.</span></div>';return}
  st.innerHTML='<div class="swipe" id="sw" tabindex="0"><img alt="Photo of '+esc(c.name)+'" src="'+c.photo+'"><div class="info"><h2>'+esc(c.name)+', '+c.age+' <span class="badge">ID verified</span></h2><div class="dim">'+esc(c.intent||"")+' · '+esc(c.body_type||"")+(c.area?" · "+esc(c.area):"")+'</div><div>'+(c.tonight_intentions||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("")+'</div></div></div>'+
  '<div class="row sp"><button class="btn ghost" id="pa" aria-label="Pass">Pass</button><button class="btn ghost" id="su" aria-label="Super like">Super</button><button class="btn" id="li" aria-label="Like">Like</button></div><button class="btn ghost sp" id="ex">View full profile</button>';
  $("#pa").onclick=function(){sw("pass")};$("#su").onclick=function(){sw("super")};$("#li").onclick=function(){sw("like")};$("#ex").onclick=function(){fullProfile(c.id)};$("#sw").onclick=function(){fullProfile(c.id)}}
async function sw(kind){var c=D.cards.shift();var d=await api("swipe",{to:c.id,kind:kind});if(d.match){sheet('<h2 class="red">It\'s a match!</h2><p>You and '+esc(d.match.name)+' matched. You have <b>24 hours</b> to send a real opener or the match disappears.</p><button class="btn" id="mm">Say something</button>',function(){$("#mm").onclick=function(){closeSheet();S.tab="matches";route();setTimeout(function(){openChat(d.match.id)},50)}})}showCard()}
async function fullProfile(id){var d=await api("profile_get",{id:id});if(!d.ok)return;var p=d.profile;
  sheet('<div class="thumbs">'+p.photos.map(function(x){return '<img alt="" src="'+x.url+'">'}).join("")+'</div><h2 class="sp">'+esc(p.name)+', '+p.age+'</h2><span class="badge">ID verified</span> <span class="dim">'+esc(p.intent||"")+' · '+esc(p.body_type||"")+(p.area?" · "+esc(p.area):"")+'</span><p>'+esc(p.bio)+'</p>'+
  (p.prompts||[]).map(function(x){return '<div class="card"><div class="dim" style="font-size:12px">'+esc(x.question)+'</div>'+esc(x.answer)+'</div>'}).join("")+
  '<div>'+(p.tonight_intentions||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("")+'</div>'+
  '<div class="card sp"><b>Compatibility <span class="dim">(estimate, not fact)</span></b><br>Chemistry '+p.compat.chemistry+'% · Lifestyle '+p.compat.lifestyle+'% · Humor '+p.compat.humor+'%</div>'+
  '<div class="row"><button class="btn ghost small" id="rp">Report</button><button class="btn ghost small" id="bk">Block</button><button class="btn ghost small" id="cl">Close</button></div>',
  function(){$("#cl").onclick=closeSheet;$("#rp").onclick=function(){reportUser(p.id)};$("#bk").onclick=async function(){if(confirm("Block "+p.name+"?")){await api("block",{user_id:p.id});closeSheet();D.cards=D.cards.filter(function(c){return c.id!=p.id});showCard&&$("#stack")&&showCard()}}})}
async function reportUser(id){var why=prompt("What happened? (a sentence is fine)");if(why===null)return;var d=await api("report",{user_id:id,reason:why});alert(d.message||d.error||"Done")}

/* ---------- sheet ---------- */
function sheet(html,after){closeSheet();var s=document.createElement("div");s.className="sheet";s.id="sh";s.innerHTML="<div>"+html+"</div>";s.onclick=function(e){if(e.target==s)closeSheet()};document.body.appendChild(s);after&&after()}
function closeSheet(){var s=$("#sh");s&&s.remove()}

/* ---------- matches + chat ---------- */
async function matches(){app.innerHTML='<h2>Matches</h2><div id="ml" class="dim sp">Loading...</div>';var d=await api("matches");if(!d.ok)return;var l=$("#ml");
  if(!d.matches.length){l.innerHTML='<div class="card" style="text-align:center">No matches yet. Go swipe.</div>';return}
  l.className="";l.innerHTML=d.matches.map(function(m){return '<div class="card list" data-id="'+m.id+'"><img class="av" alt="" src="'+(m.with.photo||"")+'"><div style="flex:1"><b>'+esc(m.with.name)+'</b><div class="dim" style="font-size:13px">'+(m.first_message_sent?esc(m.last||""):'Send an opener in '+fuseHTML(m.fuse_expires_at))+'</div></div></div>'}).join("");
  l.querySelectorAll(".list").forEach(function(el){el.onclick=function(){openChat(el.dataset.id)}});tickFuses()}
async function openChat(id){clearTimers();var d=await api("thread",{match_id:id});if(!d.ok){alert(d.error||"Could not open");return matches()}
  var m=d.match,expired=m.status=="expired";
  app.innerHTML='<div class="bar"><button class="btn ghost small" id="bk">‹ Back</button><div style="text-align:center"><b>'+esc(d.with.name)+'</b><div>'+(m.first_message_sent?'<span class="dim" style="font-size:12px">chatting</span>':fuseHTML(m.fuse_expires_at))+'</div></div><button class="btn ghost small" id="mo">•••</button></div>'+
  (m.intention?'<div class="card" style="padding:8px 12px">'+esc(m.intention_by)+' flagged this as a <b>'+esc(m.intention)+'</b></div>':'')+
  '<div class="dim" style="font-size:11px;text-align:center">Messages are scanned for safety and may be reviewed by LEGIT. Never share phone numbers or socials here.</div><div id="msgs">'+(d.messages.length?d.messages.map(function(x){return '<div class="msg '+(x.mine?"me":"them")+'">'+esc(x.text)+(x.altered?'<div style="font-size:11px;opacity:.85">⚠ Contact info ('+esc(x.reason)+') was hidden from them.</div>':'')+'</div>'}).join(""):'<div class="dim card">No messages yet. Read their profile and say something real. "Hey" won\'t pass.</div>')+'</div><div id="sg"></div><div id="er" class="err" role="alert"></div>'+
  (expired?'<div class="card">This match expired.</div>':'<textarea id="tx" rows="2" placeholder="'+(m.first_message_sent?"Message":"Write an opener")+'" maxlength="1000"></textarea><div class="row"><button class="btn ghost" id="wmb">🧠 Wingman</button><button class="btn" id="sd">Send</button></div>')+

  '<div class="card"><label>Photos (up to 4)</label><div class="thumbs" id="th">'+ph.map(function(x,i){return '<img alt="Photo '+(i+1)+'" src="'+x.url+'" data-i="'+i+'" title="Tap to remove">'}).join("")+'</div><input id="pf" type="file" accept="image/*" multiple '+(ph.length>=4?"disabled":"")+'><div class="dim" style="font-size:12px">Tap a photo to remove it.<br><b style="color:var(--red)">Real photos only.</b> No filters, no animal faces, no AI images. Clear face, recent, you.</div></div>'+
  '<div class="card"><label for="gd">I am</label><select id="gd"><option value="">Choose</option>'+["man","woman","nonbinary"].map(function(g){return '<option'+(u.gender==g?" selected":"")+'>'+g+'</option>'}).join("")+'</select><label>Interested in</label>'+chips("ii",["man","woman","nonbinary"],u.interested_in||[])+
  '<label for="it" class="sp">Looking for</label><select id="it"><option value="">Choose</option>'+[["serious","Serious"],["casual","Casual"],["one_night","One night"]].map(function(x){return '<option value="'+x[0]+'"'+(u.intent==x[0]?" selected":"")+'>'+x[1]+'</option>'}).join("")+'</select>'+
  '<label for="bt">Body type</label><select id="bt"><option value="">Prefer not to say</option>'+["slim","athletic","average","muscular","curvy","plus"].map(function(g){return '<option'+(u.body_type==g?" selected":"")+'>'+g+'</option>'}).join("")+'</select></div>'+
  '<div class="card"><label for="bi">Bio</label><textarea id="bi" rows="3" maxlength="500">'+esc(u.bio||"")+'</textarea>'+[0,1,2].map(function(i){return '<label for="pq'+i+'">Prompt '+(i+1)+'</label><select id="pq'+i+'">'+PQ.map(function(q){return '<option'+((pr[i]&&pr[i].question==q)||(!pr[i]&&q==PQ[i])?" selected":"")+'>'+esc(q)+'</option>'}).join("")+'</select><input id="pa'+i+'" maxlength="200" value="'+esc(pr[i]?pr[i].answer:"")+'">'}).join("")+'<div class="dim" style="font-size:12px">Phone numbers, emails and social handles are removed automatically.</div></div>'+
  '<div class="card"><label>Tonight\'s Intention (change any time)</label>'+chips("ti",S.intentions,u.tonight_intentions||[])+'</div>'+
  '<div class="card"><label>Who I see</label><div class="row"><div><label for="a1">Min age</label><input id="a1" type="number" value="'+u.pref_age_min+'"></div><div><label for="a2">Max age</label><input id="a2" type="number" value="'+u.pref_age_max+'"></div></div><label for="ds">Distance (miles)</label><input id="ds" type="number" value="'+u.pref_distance+'"><button class="btn ghost small" id="loc">Use my approximate location</button><div class="dim" style="font-size:12px">We blur your location to about 7 miles. Others only see a rough distance.</div><label class="sp">Body types I like (none = all)</label>'+chips("pb",["slim","athletic","average","muscular","curvy","plus"],u.pref_body||[])+'</div>'+
  '<div id="er" class="err" role="alert"></div><button class="btn" id="sv">Save profile</button><button class="btn ghost sp" id="del">Delete my account</button>';
  ["ii","ti","pb"].forEach(wireChips);$("#lo").onclick=function(){setTok("");S.user=null;auth("login")};
  var unl=$("#unl");unl&&(unl.onclick=async function(){var d=await api("checkout");if(d.url)location.href=d.url});
  $("#th").onclick=async function(e){var i=e.target.dataset&&e.target.dataset.i;if(i===undefined)return;ph.splice(+i,1);var r=await api("update_profile",{photos:ph});if(r.ok){S.user=r.user;S.complete=r.complete;profile()}};
  $("#pf").onchange=async function(){var fs=[].slice.call(this.files).slice(0,4-ph.length);for(var f of fs)ph.push({url:await shrink(f,720)});var r=await api("update_profile",{photos:ph});if(r.ok){S.user=r.user;S.complete=r.complete;profile()}else $("#er").textContent=r.error};
  $("#loc").onclick=function(){navigator.geolocation?navigator.geolocation.getCurrentPosition(async function(p){var r=await api("update_profile",{lat:p.coords.latitude,lng:p.coords.longitude});$("#er").className="ok";$("#er").textContent=r.ok?"Location saved (blurred).":"Could not save"},function(){$("#er").className="err";$("#er").textContent="Location was not allowed."}):0};
  $("#sv").onclick=async function(){var prompts=[0,1,2].map(function(i){return {question:$("#pq"+i).value,answer:$("#pa"+i).value}}).filter(function(x){return x.answer.trim()});
    var r=await api("update_profile",{gender:$("#gd").value,interested_in:picked("ii"),intent:$("#it").value,body_type:$("#bt").value,bio:$("#bi").value,prompts:prompts,tonight_intentions:picked("ti"),pref_age_min:$("#a1").value,pref_age_max:$("#a2").value,pref_distance:$("#ds").value,pref_body:picked("pb")});
    if(r.ok){S.user=r.user;S.complete=r.complete;$("#er").className="ok";$("#er").textContent=r.complete?"Saved.":"Saved. Still needed: photo, who you are, who you're into, what you're looking for."}else{$("#er").className="err";$("#er").textContent=r.error||"Error"}};
  $("#del").onclick=async function(){if(confirm("Delete your account and all your data? This can't be undone.")){await api("delete_account");setTok("");auth()}}}

/* ---------- admin ---------- */
var AT="main";
async function admin(){app.innerHTML='<h2>Admin</h2><div class="row sp" id="at">'+[["main","Overview"],["users","Accounts"],["chats","Chats"],["pay","Payments"],["log","Audit"]].map(function(t){return '<button class="btn '+(AT==t[0]?"":"ghost")+' small" data-at="'+t[0]+'">'+t[1]+'</button>'}).join("")+'</div><div id="ad" class="dim sp">Loading...</div>';
  document.querySelectorAll("[data-at]").forEach(function(b){b.onclick=function(){AT=b.dataset.at;admin()}});
  if(AT=="users")return adminUsers();if(AT=="pay")return adminPay();if(AT=="chats")return adminChats();if(AT=="log")return adminLog();
  var [s,st,rp]=await Promise.all([api("a_stats"),api("a_strikes"),api("a_reports")]);if(!s.ok)return;var x=s.stats;
  var h='<div class="card"><b>Platform stats</b><div class="dim" style="font-size:13px;line-height:1.8">Users '+x.users+' · Active today '+x.dau+' · Verified '+x.verifiedPct+'%<br>Match rate '+x.matchRate+'% · Message rate '+x.messageRate+'% · Ghost rate '+x.ghostRate+'%<br>Strikes today: 1st '+x.strikesToday[0]+' / 2nd '+x.strikesToday[1]+' / 3rd '+x.strikesToday[2]+' · Auto bans '+x.autoBansToday+'<br>Revenue today $'+x.revenueToday.toFixed(2)+' · this month $'+x.revenueMonth.toFixed(2)+' · Trial→paid '+x.conversion+'% · Love Board posts '+x.loveBoardPosts+'</div></div>';
  h+='<h3 class="sp">Strikes</h3>'+(st.strikes.length?st.strikes.map(function(k){var u=k.legit_users||{};return '<div class="card"><b>'+esc(u.name)+'</b> <span class="dim">'+esc(u.email)+'</span><div>Strike '+k.strike_no+' · '+esc(k.reason)+' · '+new Date(k.created_at).toLocaleString()+(u.banned?' · <span class="red">BANNED ('+esc(u.ban_source)+')</span>':'')+(k.reviewed?' · reviewed: '+esc(k.review_action):'')+'</div><pre class="snap">'+esc((k.conversation_snapshot||[]).map(function(m){return (m.original_text)}).join("\n"))+'</pre><div class="row">'+['dismiss','warn','ban','reverse_ban'].map(function(a){return '<button class="btn ghost small" data-k="'+k.id+'" data-a="'+a+'">'+a.replace("_"," ")+'</button>'}).join("")+'</div></div>'}).join(""):'<div class="card dim">No strikes.</div>');
  h+='<h3 class="sp">Reports</h3>'+(rp.reports.length?rp.reports.map(function(r){return '<div class="card"><b>'+esc((r.reporter||{}).name)+'</b> reported <b>'+esc((r.reported||{}).name)+'</b><div>'+esc(r.reason)+'</div><div class="dim">'+esc(r.status)+'</div>'+(r.status=="pending"?'<div class="row sp"><button class="btn small" data-rp="'+r.id+'" data-o="action">Action taken</button><button class="btn ghost small" data-rp="'+r.id+'" data-o="none">No violation</button></div>':'')+'</div>'}).join(""):'<div class="card dim">No reports.</div>');
  $("#ad").className="";$("#ad").innerHTML=h;
  document.querySelectorAll("[data-k]").forEach(function(b){b.onclick=async function(){var n=prompt("Note (optional)")||"";await api("a_strike_act",{id:b.dataset.k,act:b.dataset.a,note:n});admin()}});
  document.querySelectorAll("[data-rp]").forEach(function(b){b.onclick=async function(){await api("a_report_resolve",{id:b.dataset.rp,outcome:b.dataset.o});admin()}})}
async function adminChats(){var d=await api("a_threads");if(!d.ok)return;$("#ad").className="";
  $("#ad").innerHTML='<div class="dim" style="font-size:12px">Opening a chat is recorded in the audit log.</div>'+(d.threads.length?d.threads.map(function(t){return '<div class="card list" data-th="'+t.id+'"><div style="flex:1"><b>'+esc(t.ua&&t.ua.name)+' &amp; '+esc(t.ub&&t.ub.name)+'</b><div class="dim" style="font-size:12px">'+esc(t.status)+' · matched '+new Date(t.matched_at).toLocaleString()+(t.chat_intention?' · '+esc(t.chat_intention):'')+'</div></div></div>'}).join(""):'<div class="card dim">No matches yet.</div>');
  document.querySelectorAll("[data-th]").forEach(function(el){el.onclick=async function(){var r=await api("a_thread",{id:el.dataset.th});if(!r.ok)return alert(r.error);sheet('<h3>'+esc(r.a)+' &amp; '+esc(r.b)+'</h3>'+(r.messages.length?r.messages.map(function(m){var who=m.sender_id==r.user_a?r.a:r.b;return '<div class="card" style="padding:8px 10px"><b>'+esc(who)+'</b> <span class="dim" style="font-size:11px">'+new Date(m.sent_at).toLocaleString()+'</span><div>'+esc(m.original_text)+'</div>'+(m.was_blocked?'<div class="red" style="font-size:12px">hidden from recipient ('+esc(m.block_reason)+')</div>':'')+'</div>'}).join(""):'<div class="dim">No messages.</div>')+'<button class="btn sp" onclick="closeSheet()">Close</button>')}})}
async function adminLog(){var d=await api("a_log");if(!d.ok)return;$("#ad").className="";$("#ad").innerHTML=d.log.length?d.log.map(function(l){return '<div class="card" style="padding:8px 10px"><b>'+esc(l.action)+'</b> <span class="dim" style="font-size:12px">'+new Date(l.created_at).toLocaleString()+'<br>target '+esc(l.target)+' '+esc(l.note||"")+'</span></div>'}).join(""):'<div class="card dim">Nothing logged.</div>'}
async function adminUsers(){var d=await api("a_users");if(!d.ok)return;var f=function(t){return t?new Date(t).toLocaleString():"never"};
  $("#ad").className="";$("#ad").innerHTML='<div class="dim">'+d.users.length+' accounts</div>'+d.users.map(function(u){var st=u.banned?'<span class="red">BANNED ('+esc(u.ban_source)+')</span>':u.paid_lifetime_access?'<span class="green">PAID</span>':u.identity_verified?'<span class="green">verified, trial</span>':'<span class="dim">not verified</span>';
    return '<div class="card"><b>'+esc(u.name)+', '+u.age+'</b>'+(u.is_admin?' <span class="badge">ADMIN</span>':'')+' · '+st+'<div class="dim" style="font-size:12px">'+esc(u.email)+'<br>Joined '+f(u.created_at)+' · Last seen '+f(u.last_seen)+'<br>Verified '+f(u.verified_at)+' · Paid '+f(u.paid_at)+' · Strikes '+u.strike_count+'/3</div>'+
    '<div class="row sp"><button class="btn ghost small" data-pw="'+u.id+'">Set password</button></div>'+(u.is_admin?'':'<div class="row sp">'+(u.banned?'<button class="btn ghost small" data-u="'+u.id+'" data-a="unban">Unban</button>':'<button class="btn ghost small" data-u="'+u.id+'" data-a="ban">Ban</button>')+(u.paid_lifetime_access?'':'<button class="btn ghost small" data-u="'+u.id+'" data-a="grant_paid">Grant lifetime</button>')+'</div>')+'</div>'}).join("");
  document.querySelectorAll("[data-pw]").forEach(function(b){b.onclick=async function(){var p=prompt("New password for this person (8+ characters). Tell them privately.");if(!p)return;var r=await api("a_user_setpw",{id:b.dataset.pw,password:p});alert(r.ok?"Password changed.":r.error)}});
  document.querySelectorAll("[data-u]").forEach(function(b){b.onclick=async function(){if(!confirm(b.dataset.a+" this account?"))return;var r=await api("a_user_act",{id:b.dataset.u,act:b.dataset.a});if(!r.ok)alert(r.error);adminUsers()}})}
async function adminPay(){var d=await api("a_payments");if(!d.ok)return;$("#ad").className="";
  $("#ad").innerHTML='<div class="card"><div class="dim">Total collected</div><div class="h" style="font-size:32px">$'+(d.totalCents/100).toFixed(2)+'</div></div>'+(d.payments.length?d.payments.map(function(p){var u=p.legit_users||{};return '<div class="card"><b>$'+((p.amount_cents||0)/100).toFixed(2)+'</b> · '+esc(u.name||"deleted user")+' <span class="dim">'+esc(u.email||"")+'</span><div class="dim" style="font-size:12px">'+new Date(p.created_at).toLocaleString()+'<br>Stripe ref '+esc(p.stripe_session_id)+'</div></div>'}).join(""):'<div class="card dim">No payments yet.</div>')}
(function(){var n=0,t=0;document.getElementById("cp").onclick=function(){var now=Date.now();n=(now-t<3000?n:0)+1;t=now;if(n>=5){n=0;location.href="/legit/admin/"}}})();
boot();
</script>
