<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LEGIT Weddings — Georgia</title><meta name="theme-color" content="#060607">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060607;--card:#101013;--line:#25252b;--red:#e8112d;--chrome:#c8ccd4;--green:#16d96f;--amber:#f5b301;--txt:#f2f2f4;--dim:#8d8d97}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
#app{max-width:640px;margin:0 auto;padding:16px 16px 80px}a{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.dim{color:var(--dim)}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer;width:100%}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--chrome)}.btn.small{width:auto;padding:8px 12px;font-size:13px}
input,select,textarea{width:100%;background:#0b0b0d;border:1px solid var(--line);border-radius:10px;padding:12px;margin:5px 0 10px;color:inherit;font:inherit}
.price{font:700 34px Oswald,sans-serif;color:var(--chrome)}.pill{border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:12px;color:var(--dim)}
.notice{border:1px solid var(--amber);border-radius:12px;padding:10px 12px;color:var(--amber)}.err{color:#ff6b6b;min-height:20px}.ok{color:var(--green)}
ul{padding-left:18px;margin:6px 0}li{margin:2px 0}label{font-size:13px;color:var(--dim)}.hide{display:none}
</style></head><body><div id="app"><div class="dim">Loading…</div></div>
<script>
var API="/.netlify/functions/legit-weddings",$=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tok(){try{return localStorage.getItem("legit_token")||""}catch(e){return""}}
function call(b){return fetch(API,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok()},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw Object.assign(new Error(j.error||"Something went wrong"),{j:j});return j})})}
var usd=function(c){return"$"+(c/100).toLocaleString("en-US",{minimumFractionDigits:0})};
function load(){call({action:"packages"}).then(function(j){
 var h='<h1>LEGIT <span style="color:var(--red)">Weddings</span></h1><div class="notice">'+esc(j.notice)+'</div><p class="dim">You don\'t need a LEGIT dating account to request a wedding consultation.</p>';
 h+=j.packages.map(function(p){return'<div class="card"><h2>'+esc(p.title)+'</h2><div class="price">'+usd(p.price_cents)+'</div><div class="dim">'+esc(p.summary)+'</div><b>Included</b><ul>'+p.includes.map(function(x){return'<li>'+esc(x)+'</li>'}).join("")+'</ul><b>Not included</b><ul>'+p.excludes.map(function(x){return'<li>'+esc(x)+'</li>'}).join("")+'</ul><div class="dim">Guest limit: '+p.guest_limit+'. Payment schedule: '+esc(p.payment_schedule)+' Cancellation: '+esc(p.cancellation)+'</div><button class="btn" data-pk="'+esc(p.key)+'" style="margin-top:10px">Request a consultation</button></div>'}).join("");
 h+='<div class="card hide" id="form"><h2>Request a consultation</h2><div class="dim">Free. A request is not a booking and nothing is charged.</div><label>Package<select id="pk">'+j.packages.map(function(p){return'<option value="'+esc(p.key)+'">'+esc(p.title)+'</option>'}).join("")+'</select></label>'+
  '<label>Your name<input id="nm" autocomplete="name"></label><label>Email<input id="em" type="email" autocomplete="email"></label><label>Phone (optional)<input id="ph" type="tel"></label><label>Event date (optional)<input id="dt" type="date"></label><label>Estimated guests<input id="gc" type="number" min="1"></label>'+
  '<label>Venue name (or proposed location)<input id="vn"></label><label>Venue city<input id="vc"></label><label>State<input id="vs" maxlength="2" value="GA" style="text-transform:uppercase"></label><label>ZIP<input id="vz" inputmode="numeric"></label>'+
  '<label>Your vision<textarea id="vi" rows="4"></textarea></label><input id="ws" class="hide" tabindex="-1" autocomplete="off"><button class="btn" id="go">Send request</button><div class="err" id="er"></div></div><div id="adm"></div>';
 $("app").innerHTML=h;
 [].forEach.call(document.querySelectorAll("[data-pk]"),function(b){b.onclick=function(){$("form").classList.remove("hide");$("pk").value=b.dataset.pk;$("form").scrollIntoView()}});
 $("go").onclick=function(){$("er").textContent="";call({action:"request",package_key:$("pk").value,name:$("nm").value,email:$("em").value,phone:$("ph").value,event_date:$("dt").value,guest_count:$("gc").value,venue_name:$("vn").value,venue_city:$("vc").value,venue_state:$("vs").value,venue_zip:$("vz").value,vision:$("vi").value,website:$("ws").value}).then(function(r){$("form").innerHTML='<h2 class="ok">Request received</h2><p>'+esc(r.message)+'</p>'}).catch(function(e){$("er").textContent=e.message})};
 if(tok())call({action:"a_list"}).then(admin).catch(function(){})}).catch(function(e){$("app").innerHTML='<div class="card">'+esc(e.message)+'</div>'})}
function admin(j){var h='<h2 style="margin-top:24px">Staff: consultation requests</h2>'+(j.requests.length?j.requests.map(function(r){return'<div class="card"><b>'+esc(r.name)+'</b> <span class="pill">'+esc(r.status)+'</span><br><span class="dim">'+esc(r.email)+(r.phone?" · "+esc(r.phone):"")+'<br>'+esc(r.package_key||"no package")+' · '+esc(r.event_date||"no date")+' · '+(r.guest_count||"?")+' guests<br>'+esc([r.venue_name,r.venue_city,r.venue_state].filter(Boolean).join(", "))+'</span><p>'+esc(r.vision||"")+'</p><select data-s="'+r.id+'">'+j.statuses.map(function(s){return'<option'+(s===r.status?" selected":"")+'>'+s+'</option>'}).join("")+'</select><input data-n="'+r.id+'" placeholder="Staff note" value="'+esc(r.staff_note||"")+'"><button class="btn small" data-save="'+r.id+'">Save</button></div>'}).join(""):'<div class="dim">No requests yet.</div>')+
 '<h2>Service areas</h2><div class="card">'+j.areas.map(function(a){return'<label style="display:block"><input type="checkbox" style="width:auto" data-area="'+a.state+'"'+(a.enabled?" checked":"")+'> '+esc(a.name)+' ('+a.state+')</label>'}).join("")+'<div class="dim">Georgia is the only state enabled at launch. Enabling another state is a business decision, so confirm operations, insurance and contracts first.</div></div><div class="dim">Package prices and inclusions are editable through the a_pkg_set action; see SETUP-LEGIT-WEDDINGS in SETUP-MUSIC.md notes.</div>';
 $("adm").innerHTML=h;
 [].forEach.call(document.querySelectorAll("[data-save]"),function(b){b.onclick=function(){var id=b.dataset.save;call({action:"a_status",id:id,status:document.querySelector('[data-s="'+id+'"]').value,staff_note:document.querySelector('[data-n="'+id+'"]').value}).then(function(){b.textContent="Saved"}).catch(function(e){alert(e.message)})}});
 [].forEach.call(document.querySelectorAll("[data-area]"),function(c){c.onchange=function(){if(c.checked&&!confirm("Open wedding bookings in "+c.dataset.area+"? Only do this when you can actually serve it."))return c.checked=false;call({action:"a_area_set",state:c.dataset.area,enabled:c.checked,name:c.parentNode.textContent.trim().replace(/ \(.*/,"")}).catch(function(e){alert(e.message)})}})}
load();
</script></body></html>
