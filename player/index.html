<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POTENT PLAYER OS</title><meta name="theme-color" content="#000000">
<style>
:root{--y:#f5c400;--bg:#000;--c:#111;--l:#222;--t:#f4f4f4;--d:#9a9a9a}
*{box-sizing:border-box}body{margin:0;background:#000;color:var(--t);font:15px/1.45 Inter,system-ui,sans-serif;padding-bottom:78px}
.w{max-width:560px;margin:0 auto;padding:16px}h1{font-size:30px;margin:6px 0 0;letter-spacing:.02em}h1 b{color:var(--y)}h2{font-size:18px;margin:4px 0 10px}
.dim{color:var(--d);font-size:13px}.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin:12px 0}
textarea,input,select{width:100%;background:#000;color:var(--t);border:1px solid #333;border-radius:10px;padding:11px;font:inherit;margin:6px 0}
button{background:var(--y);color:#000;border:0;border-radius:10px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer;width:100%;margin-top:6px}
button.g{background:transparent;color:var(--t);border:1px solid #444}button.s{width:auto;padding:7px 12px;font-size:13px}button:disabled{opacity:.5}
nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid var(--l);display:flex}nav a{flex:1;text-align:center;padding:10px 2px 12px;color:var(--d);font-size:11px;font-weight:700;cursor:pointer}nav a.on{color:var(--y)}nav a span{display:block;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{border:1px solid #444;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--d)}.chip.on{background:var(--y);color:#000;border-color:var(--y);font-weight:800}
.out{white-space:pre-wrap;background:#0b0b0b;border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin-top:10px}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;background:#222;color:var(--y);border-radius:6px;padding:3px 7px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
img.sh{max-width:100%;border-radius:10px;margin-top:8px}.note{font-size:12px;color:var(--d);border-left:3px solid var(--y);padding-left:10px;margin:10px 0}
</style></head><body><div class="w" id="app"></div>
<nav id="nav"></nav>
<script>
var $=function(s){return document.querySelector(s)},app=$("#app");
var K="potent_player_v1",D;try{D=JSON.parse(localStorage.getItem(K)||"null")}catch(e){}
D=D||{chats:[],dates:[],journal:[],goals:"",profile:{style:"Smooth and confident",vocab:"",length:"short",emoji:"some",bounds:"",sample:""}};
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var STY=["Smooth","Funny","Mysterious","Direct","Romantic","Playful","Bold"],GOALS=["Make them laugh","Keep it going","Flirt naturally","Ask them out","Clarify intentions","Respond to mixed signals","End it respectfully"];
var STAT=["NEW CONVERSATION","BUILDING RAPPORT","MUTUAL INTEREST","DATE PROPOSED","DATE CONFIRMED","FOLLOW-UP NEEDED","CLOSED"];
var tab="wing",st={style:"Smooth",goal:"Keep it going",img:"",out:""};
var TABS=[["wing","💬","Wingman"],["read","🔍","Read"],["date","🍷","Dates"],["dash","📋","Dashboard"],["me","🎛","Style"],["coach","🧠","Coach"]];
function nav(){$("#nav").innerHTML=TABS.map(function(t){return'<a data-t="'+t[0]+'" class="'+(tab==t[0]?"on":"")+'"><span>'+t[1]+'</span>'+t[2]+'</a>'}).join("");document.querySelectorAll("nav a").forEach(function(a){a.onclick=function(){tab=a.dataset.t;st.out="";render()}})}
async function ai(mode,text,extra){var r;try{r=await fetch("/.netlify/functions/player-ai",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({mode:mode,text:text,profile:D.profile},extra||{}))});r=await r.json()}catch(e){r={ok:false,error:"No connection."}}return r.ok?r.text:"⚠️ "+r.error}
function chips(list,cur,id){return'<div class="chips" id="'+id+'">'+list.map(function(x){return'<span class="chip '+(x==cur||cur.indexOf(x)==0?"on":"")+'" data-v="'+esc(x)+'">'+esc(x)+'</span>'}).join("")+'</div>'}
function bindChips(id,fn){document.querySelectorAll("#"+id+" .chip").forEach(function(c){c.onclick=function(){fn(c.dataset.v);render()}})}
function copyBtns(txt){var m=txt.split("\n").filter(function(l){return/^(RECOMMENDED|ALT \d):/.test(l)});return m.map(function(l,i){var v=l.replace(/^[A-Z ]+\d?:\s*/,"");return'<button class="g s" data-cp="'+esc(v)+'" style="margin:4px 6px 0 0">Copy '+(i?"alt "+i:"main")+'</button>'}).join("")}
function bindCopy(){document.querySelectorAll("[data-cp]").forEach(function(b){b.onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(b.dataset.cp);b.textContent="Copied ✓"}})}
function shrink(file,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=1100,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};im.src=fr.result};fr.readAsDataURL(file)}
function head(sub){return'<h1>POTENT <b>PLAYER</b> OS™</h1><div class="dim">'+sub+'</div>'}
function render(){nav();
 if(tab=="wing"){app.innerHTML=head("Your private wingman. \"Bro, what do I say back?\" 😂")+'<div class="card"><h2>What do I say back?</h2><textarea id="tx" rows="5" placeholder="Paste the conversation or what they said...\n(or upload a screenshot below)"></textarea><input type="file" id="fi" accept="image/*"><div id="pv">'+(st.img?'<img class="sh" src="'+st.img+'">':"")+'</div><div class="dim">Goal</div>'+chips(GOALS,st.goal,"gl")+'<div class="dim">Style</div>'+chips(STY,st.style,"sy")+'<button id="go">Give me 3 replies</button><div id="o"></div><div class="note">Screenshots are read once by the AI and are not saved. Only what\'s visible is used. My read of them is an estimate, not a fact.</div></div>';
  bindChips("gl",function(v){st.goal=v});bindChips("sy",function(v){st.style=v});
  $("#fi").onchange=function(){if(this.files[0])shrink(this.files[0],function(d){st.img=d;$("#pv").innerHTML='<img class="sh" src="'+d+'">'})};
  if(st.out)showOut("#o",st.out);
  $("#go").onclick=async function(){var t=$("#tx").value.trim();if(!t&&!st.img)return;var b=this;b.disabled=true;$("#o").innerHTML='<div class="out">Thinking...</div>';st.out=await ai("reply",t,{image:st.img,style:st.style,goal:st.goal});b.disabled=false;showOut("#o",st.out)}}
 else if(tab=="read"){app.innerHTML=head("Conversation intelligence")+'<div class="card"><h2>Read this conversation</h2><textarea id="tx" rows="6" placeholder="Paste the whole conversation..."></textarea><input type="file" id="fi" accept="image/*"><div id="pv">'+(st.img?'<img class="sh" src="'+st.img+'">':"")+'</div><button id="go">Analyze</button><div id="o"></div><div class="note">Reading messages is guessing. This is an estimate, never a fact, and there are no fake attraction scores.</div></div>';
  $("#fi").onchange=function(){if(this.files[0])shrink(this.files[0],function(d){st.img=d;$("#pv").innerHTML='<img class="sh" src="'+d+'">'})};if(st.out)showOut("#o",st.out);
  $("#go").onclick=async function(){var t=$("#tx").value.trim();if(!t&&!st.img)return;this.disabled=true;$("#o").innerHTML='<div class="out">Reading...</div>';st.out=await ai("analyze",t,{image:st.img});this.disabled=false;showOut("#o",st.out)}}
 else if(tab=="date"){app.innerHTML=head("Date planner")+'<div class="card"><h2>Plan a date</h2><input id="lc" placeholder="City / area"><div class="row"><input id="bd" placeholder="Budget ($)"><input id="wn" placeholder="When (Sat night)"></div><input id="in" placeholder="Interests (food, music, outdoors...)"><select id="ty"><option>First date</option><option>Casual hangout</option><option>Established relationship</option><option>Spontaneous meetup</option></select><button id="go">Plan it</button><div id="o"></div></div>'+
  '<div class="card"><h2>Tracked dates</h2><div class="row"><input id="dn" placeholder="With who"><input id="dw" placeholder="When"></div><input id="dp" placeholder="Where / plan"><button class="g" id="ad">Add date</button>'+D.dates.map(function(x,i){return'<div class="card"><b>'+esc(x.n)+'</b> · '+esc(x.w)+'<br><span class="dim">'+esc(x.p)+'</span><div class="row"><select data-d="'+i+'">'+["Proposed","Confirmed","Done","Cancelled"].map(function(s){return'<option'+(s==x.s?" selected":"")+'>'+s+'</option>'}).join("")+'</select><button class="g s" data-x="'+i+'">Remove</button></div></div>'}).join("")+'</div>';
  if(st.out)showOut("#o",st.out);
  $("#go").onclick=async function(){this.disabled=true;$("#o").innerHTML='<div class="out">Planning...</div>';st.out=await ai("date","Type: "+$("#ty").value+". Location: "+$("#lc").value+". Budget: "+$("#bd").value+". When: "+$("#wn").value+". Interests: "+$("#in").value);this.disabled=false;showOut("#o",st.out)};
  $("#ad").onclick=function(){if(!$("#dn").value)return;D.dates.push({n:$("#dn").value,w:$("#dw").value,p:$("#dp").value,s:"Proposed"});save();render()};
  document.querySelectorAll("[data-d]").forEach(function(s){s.onchange=function(){D.dates[s.dataset.d].s=s.value;save()}});document.querySelectorAll("[data-x]").forEach(function(s){s.onclick=function(){D.dates.splice(s.dataset.x,1);save();render()}})}
 else if(tab=="dash"){app.innerHTML=head("Player dashboard · private on this device")+'<div class="card"><h2>Active conversations</h2><div class="row"><input id="cn" placeholder="Name"><select id="cs">'+STAT.map(function(s){return'<option>'+s+'</option>'}).join("")+'</select></div><input id="ct" placeholder="Note / follow-up reminder"><button id="ac">Add</button>'+D.chats.map(function(c,i){return'<div class="card"><b>'+esc(c.n)+'</b> <span class="tag">'+esc(c.s)+'</span><div class="dim">'+esc(c.t)+'</div><div class="row"><select data-c="'+i+'">'+STAT.map(function(s){return'<option'+(s==c.s?" selected":"")+'>'+s+'</option>'}).join("")+'</select><button class="g s" data-r="'+i+'">Remove</button></div></div>'}).join("")+'</div>'+
  '<div class="card"><h2>My goals & intentions</h2><textarea id="gs" rows="3" placeholder="What am I here for? What do I want to get better at?">'+esc(D.goals)+'</textarea></div><div class="card"><h2>Journal · lessons learned</h2><textarea id="jt" rows="3" placeholder="What worked? What would I do differently?"></textarea><button class="g" id="aj">Save entry</button>'+D.journal.slice().reverse().map(function(j){return'<div class="out"><span class="dim">'+esc(j.d)+'</span>\n'+esc(j.t)+'</div>'}).join("")+'</div>'+
  '<div class="card"><h2>Your data</h2><div class="dim">Everything here lives only on this device.</div><button class="g" id="bk">Download backup</button><button class="g" id="dl">Delete everything</button></div>';
  $("#ac").onclick=function(){if(!$("#cn").value)return;D.chats.push({n:$("#cn").value,s:$("#cs").value,t:$("#ct").value});save();render()};
  document.querySelectorAll("[data-c]").forEach(function(s){s.onchange=function(){D.chats[s.dataset.c].s=s.value;save();render()}});document.querySelectorAll("[data-r]").forEach(function(s){s.onclick=function(){D.chats.splice(s.dataset.r,1);save();render()}});
  $("#gs").onchange=function(){D.goals=this.value;save()};$("#aj").onclick=function(){var v=$("#jt").value.trim();if(!v)return;D.journal.push({d:new Date().toLocaleDateString(),t:v});save();render()};
  $("#bk").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:"application/json"}));a.download="player-os-backup.json";a.click()};
  $("#dl").onclick=function(){if(confirm("Delete all Player OS data on this device?")){try{localStorage.removeItem(K)}catch(e){}location.reload()}}}
 else if(tab=="me"){var p=D.profile;app.innerHTML=head("Personality engine")+'<div class="card"><h2>My texting style</h2>'+chips(["Smooth and confident","Funny and playful","Calm and mysterious","Direct and straightforward","Romantic and thoughtful","Bold and flirtatious"],p.style,"ps")+'<label class="dim">My slang / words I use</label><input id="pv1" value="'+esc(p.vocab)+'" placeholder="bet, lowkey, haha..."><div class="row"><div><label class="dim">Length</label><select id="pl"><option>short</option><option>medium</option><option>long</option></select></div><div><label class="dim">Emojis</label><select id="pe"><option>none</option><option>some</option><option>lots</option></select></div></div><label class="dim">My boundaries (things it should never suggest)</label><input id="pb" value="'+esc(p.bounds)+'"><label class="dim">Paste a few of YOUR real texts so it learns your voice (only what you choose)</label><textarea id="ps2" rows="4">'+esc(p.sample)+'</textarea><button id="sv">Save my style</button></div>';
  bindChips("ps",function(v){D.profile.style=v;save()});$("#pl").value=p.length;$("#pe").value=p.emoji;
  $("#sv").onclick=function(){D.profile.vocab=$("#pv1").value;D.profile.length=$("#pl").value;D.profile.emoji=$("#pe").value;D.profile.bounds=$("#pb").value;D.profile.sample=$("#ps2").value;save();this.textContent="Saved ✓"}}
 else{app.innerHTML=head("Real-world social skills")+'<div class="card"><h2>Ask the coach</h2><div class="chips" id="cq">'+["How do I start a conversation?","How do I compliment someone without being corny?","How do I ask her out?","How do I handle rejection?","How do I know she\'s not interested?","How do I set a boundary?"].map(function(q){return'<span class="chip" data-v="'+esc(q)+'">'+esc(q)+'</span>'}).join("")+'</div><textarea id="tx" rows="3" placeholder="Or ask your own question..."></textarea><button id="go">Coach me</button><div id="o"></div><div class="note">Coaching is about being honest and respectful. No means no, and it ends the conversation.</div></div>';
  if(st.out)showOut("#o",st.out);document.querySelectorAll("#cq .chip").forEach(function(c){c.onclick=function(){$("#tx").value=c.dataset.v}});
  $("#go").onclick=async function(){var t=$("#tx").value.trim();if(!t)return;this.disabled=true;$("#o").innerHTML='<div class="out">Thinking...</div>';st.out=await ai("coach",t);this.disabled=false;showOut("#o",st.out)}}
}
function showOut(sel,t){$(sel).innerHTML='<div class="out">'+esc(t)+'</div>'+copyBtns(t);bindCopy()}
render();
</script></body></html>
