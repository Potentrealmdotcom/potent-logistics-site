<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark light"><link rel="icon" href="data:,">
<title>Artwork, Vinyl & Collectibles — POTENT Music</title><meta name="description" content="Cover art, vinyl packaging, figurines and limited-edition collectibles from POTENT."><link rel="stylesheet" href="/music/base.css"></head><body>
<script src="/music/nav.js"></script>
<h1>Artwork, Vinyl &amp; <span>Collectibles</span></h1>
<div class="muted">Cover art and vinyl packaging for your release, and individually numbered POTENT Artist Collectibles.</div>
<div id="thanks"></div>
<div class="tabs" id="tabs"><button data-t="order" class="on">Order artwork</button><button data-t="coll">Collectibles</button><button data-t="mine">My orders</button><button data-t="cert">Check a certificate</button></div>
<div id="main"><div class="muted">Loading…</div></div>
<script src="/music/common.js"></script>
<script>
var esc=PM.esc,$=function(i){return document.getElementById(i)},usd=function(c){return"$"+(c/100).toFixed(2).replace(/\.00$/,"")},TAB="order";
function svc(b){return PM.api("music-services",b)}
function pub(b){return fetch("/.netlify/functions/music-services",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Something went wrong");return j})})}
if(new URLSearchParams(location.search).get("paid"))$("thanks").innerHTML='<div class="card"><b>Payment received. Thank you!</b> Your order is under My orders.</div>';
var FAM={cover_art:"Cover art",vinyl:"Vinyl artwork & packaging",figurine:"Custom figurine"};
function order(){pub({action:"tiers"}).then(function(j){var by={};j.tiers.forEach(function(t){(by[t.family]=by[t.family]||[]).push(t)});
 $("main").innerHTML=Object.keys(by).map(function(f){return'<h2>'+FAM[f]+'</h2><div class="card">'+by[f].map(function(t){return'<div class="beat"><div class="bi"><b>'+esc(t.title)+'</b><small class="muted">'+esc(t.description||"")+'</small></div><div style="text-align:right"><b>'+(t.is_quote?'from ':'')+usd(t.price_cents)+'</b><br><button data-o="'+t.key+'">'+(t.is_quote?'Request a quote':'Order')+'</button></div></div>'}).join("")+'</div>'}).join("")+'<div id="ob"></div>';
 [].forEach.call(document.querySelectorAll("[data-o]"),function(b){b.onclick=function(){var t=j.tiers.filter(function(x){return x.key===b.dataset.o})[0];
  $("ob").innerHTML='<div class="card" style="border-color:var(--gold)"><b>'+esc(t.title)+'</b><div class="muted"><small>'+(t.is_quote?'This starts at '+usd(t.price_cents)+'. Send your brief and we reply with your exact price. You only pay after you see it.':'You pay '+usd(t.price_cents)+' after you send your brief.')+'</small></div><textarea id="br" rows="5" placeholder="Describe what you want: the song, the mood, colors, references, anything we should know."></textarea><button id="osend">'+(t.is_quote?'Send for a quote':'Continue to payment')+'</button><div id="om" class="muted"></div></div>';$("ob").scrollIntoView();
  $("osend").onclick=function(){svc({action:"order_create",tier_key:t.key,brief:$("br").value}).then(function(r){if(r.status==="awaiting_payment")return svc({action:"order_pay",id:r.id}).then(function(p){location.href=p.url});$("om").textContent="Sent. We will notify you when your price is ready.";}).catch(function(e){if(e.status===401)PM.login(order);else $("om").textContent=e.message})}}})}).catch(function(e){$("main").innerHTML='<div class="card err">'+esc(e.message)+'</div>'})}
function coll(){pub({action:"coll_list"}).then(function(j){$("main").innerHTML='<div class="card"><b>POTENT Artist Collectibles</b><br><small class="muted">Each piece is sold individually and numbered within its edition. You get a certificate code you can check on this page. Ships within the US. If an edition sells out while you pay, you are refunded automatically.</small></div>'+(j.items.length?j.items.map(function(c){return'<div class="card"><div class="row">'+(c.image_url?'<img alt="" src="'+esc(c.image_url)+'" style="width:110px;height:110px;object-fit:cover;border-radius:12px">':'')+'<div style="flex:1 1 200px"><b>'+esc(c.title)+'</b><div class="muted"><small>'+esc(c.description||"")+'</small></div><div><b>'+usd(c.price_cents)+'</b> · <small>'+(c.left>0?c.left+' of '+c.edition_size+' left':'Sold out')+'</small></div>'+(c.left>0?'<label class="ck"><input type="checkbox" data-ag="'+c.id+'"><span>I understand each collectible is a physical, numbered, limited-edition item and all sales are final.</span></label><button data-cb="'+c.id+'">Buy</button>':'')+'</div></div></div>'}).join(""):'<div class="card muted">Nothing is on sale right now.</div>');
 [].forEach.call(document.querySelectorAll("[data-cc]"),function(b){b.onclick=function(){if(!document.querySelector('[data-ag="'+b.dataset.cc+'"]').checked){PM.toast("Please tick the box first");return}
  var f=prompt("Shipping (US only). Format: Full name; Street address; City; State (2 letters); ZIP");if(!f)return;var a=f.split(";").map(function(x){return x.trim()});
  b.disabled=true;PM.api("music-coins",{action:"pay_collectible",id:b.dataset.cc,agree:true,ship:{name:a[0],line1:a[1],city:a[2],state:a[3],postal_code:a[4]}}).then(function(r){PM.toast("Reserved: edition #"+r.edition);location.href="?paid=1"}).catch(function(e){if(e.status===401)PM.login(coll);else PM.toast(e.message);b.disabled=false})}});
 [].forEach.call(document.querySelectorAll("[data-cb]"),function(b){b.onclick=function(){if(!document.querySelector('[data-ag="'+b.dataset.cb+'"]').checked){PM.toast("Please tick the box first");return}b.disabled=true;svc({action:"coll_buy",id:b.dataset.cb,agree:true}).then(function(r){location.href=r.url}).catch(function(e){if(e.status===401)PM.login(coll);else PM.toast(e.message);b.disabled=false})}})})}
function mine(){svc({action:"order_list"}).then(function(j){$("main").innerHTML='<h2>Artwork orders</h2>'+(j.orders.length?j.orders.map(function(o){var price=o.quote_cents!=null?o.quote_cents:o.price_cents;return'<div class="card"><b>'+esc(o.music_service_tiers.title)+'</b> <span class="st">'+esc(o.status.replace("_"," "))+'</span><div class="muted"><small>'+(price?usd(price):'price not set yet')+' · '+new Date(o.created_at).toLocaleDateString()+'</small></div><div><small>'+esc(o.brief.slice(0,160))+'</small></div><div class="row">'+(o.status==="awaiting_payment"?'<button data-pay="'+o.id+'">Pay '+usd(price)+'</button><button class="alt" data-coinpay="'+o.id+'">Pay with coins</button>':'')+((o.status==="quote_requested"||o.status==="awaiting_payment")?'<button class="alt" data-cx="'+o.id+'">Cancel</button>':'')+(o.delivered_url?'<a class="btn" href="'+esc(o.delivered_url)+'" target="_blank" rel="noopener">Open delivery</a>':'')+'</div></div>'}).join(""):'<div class="card muted">No orders yet.</div>')+
 '<h2>My collectibles</h2>'+(j.units.length?j.units.map(function(u){return'<div class="card"><b>'+esc(u.music_collectibles.title)+'</b> <span class="st">'+esc(u.status.replace("_"," "))+'</span><div class="muted"><small>Edition '+u.edition_no+' of '+u.music_collectibles.edition_size+(u.tracking?' · tracking '+esc(u.tracking):'')+'</small></div><div>Certificate code: <b>'+esc(u.certificate_code)+'</b></div></div>'}).join(""):'<div class="card muted">None yet.</div>');
 [].forEach.call(document.querySelectorAll("[data-coinpay]"),function(b){b.onclick=function(){if(!confirm("Pay with POTENT Coins? All sales are final."))return;b.disabled=true;PM.api("music-coins",{action:"pay_service",id:b.dataset.coinpay}).then(function(){PM.toast("Paid with coins");mine()}).catch(function(e){PM.toast(e.message);b.disabled=false})}});
 [].forEach.call(document.querySelectorAll("[data-pay]"),function(b){b.onclick=function(){svc({action:"order_pay",id:b.dataset.pay}).then(function(r){location.href=r.url}).catch(function(e){PM.toast(e.message)})}});
 [].forEach.call(document.querySelectorAll("[data-cx]"),function(b){b.onclick=function(){svc({action:"order_cancel",id:b.dataset.cx}).then(mine).catch(function(e){PM.toast(e.message)})}})}).catch(function(e){if(e.status===401){$("main").innerHTML='<div class="card"><p>Sign in to see your orders.</p><button id="si">Sign in / Create account</button></div>';$("si").onclick=function(){PM.login(mine)}}else $("main").innerHTML='<div class="card err">'+esc(e.message)+'</div>'})}
function cert(){$("main").innerHTML='<div class="card"><b>Check a certificate</b><input id="cc" placeholder="Certificate code"><button id="cg">Check</button><div id="cr"></div></div>';var c0=new URLSearchParams(location.search).get("c");if(c0)$("cc").value=c0;
 $("cg").onclick=function(){pub({action:"cert_get",code:$("cc").value}).then(function(j){var c=j.certificate;$("cr").innerHTML='<div class="card" style="border-color:'+(c.valid?"#2ecc71":"#e74c3c")+'"><b>'+(c.valid?"Valid":"Not valid (refunded)")+'</b><br>'+esc(c.title)+' — edition '+c.edition_no+' of '+c.edition_size+'<br><small class="muted">Issued '+new Date(c.issued).toLocaleDateString()+' · status '+esc(c.status.replace("_"," "))+'</small>'+(c.image_url?'<br><img alt="" src="'+esc(c.image_url)+'" style="max-width:160px;border-radius:10px;margin-top:8px">':'')+'</div>'}).catch(function(e){$("cr").innerHTML='<div class="err">'+esc(e.message)+'</div>'})};if(c0)$("cg").click()}
function show(){({order:order,coll:coll,mine:mine,cert:cert})[TAB]()}
[].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.onclick=function(){TAB=b.dataset.t;[].forEach.call(document.querySelectorAll("#tabs button"),function(x){x.classList.toggle("on",x===b)});show()}});
if(new URLSearchParams(location.search).get("c")){TAB="cert"}
if(new URLSearchParams(location.search).get("paid"))TAB="mine";
[].forEach.call(document.querySelectorAll("#tabs button"),function(x){x.classList.toggle("on",x.dataset.t===TAB)});
PM.onAuth=show;PM.wire();show();
</script></body></html>
