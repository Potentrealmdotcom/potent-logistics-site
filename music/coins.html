<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark light"><link rel="icon" href="data:,">
<title>POTENT Coins — POTENT Music</title><link rel="stylesheet" href="/music/base.css">
<style>.coin{display:flex;align-items:center;gap:14px}.disc{flex:0 0 76px;height:76px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#c9ccd1 45%,#7c8087);box-shadow:inset 0 0 0 3px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:#222;font-weight:800;font-size:11px;text-align:center;line-height:1.1}</style></head><body>
<script src="/music/nav.js"></script>
<h1>POTENT <span>Coins</span></h1>
<div class="muted">A collectible credit you can spend inside POTENT Music. Virtus non venditur: it is a coin, not money.</div>
<div id="main" style="margin-top:12px"><div class="muted">Loading…</div></div>
<script src="/music/common.js"></script>
<script>
var esc=PM.esc,$=function(i){return document.getElementById(i)},coins=function(c){return(c/100).toFixed(2)};
function dt(d){return new Date(d).toLocaleString()}
function go(){PM.api("music-coins",{action:"wallet"}).then(function(j){
 $("main").innerHTML='<div class="card coin"><div class="disc">POTENT<br>FORTITUDO<br>SAPIENTIA</div><div><small class="muted">Your balance</small><div style="font-size:30px;font-weight:800">'+coins(j.balance_cents)+' coins</div></div></div>'+
 '<div class="card"><b>How coins work</b><ul><li>Spend them on beats and music in POTENT Music'+(j.pay_enabled?'.':' (turned on soon).')+'</li><li>They stay in your account. They cannot be sent to other people or cashed out.</li><li>If a purchase is refunded, the coins come back to you.</li></ul><small class="muted">'+esc(j.rules)+'</small></div>'+
 '<h2>History</h2>'+(j.ledger.length?'<div class="card"><table>'+j.ledger.map(function(l){return'<tr><td>'+dt(l.created_at)+'</td><td>'+esc(l.note||l.type)+'<br><small class="muted">'+esc(l.type.replace("_"," "))+'</small></td><td style="text-align:right;color:'+(l.delta_cents<0?"#e74c3c":"#2ecc71")+'">'+(l.delta_cents>0?"+":"")+coins(l.delta_cents)+'<br><small class="muted">'+coins(l.balance_after)+'</small></td></tr>'}).join("")+'</table></div>':'<div class="card muted">Nothing yet.</div>')+
 '<h2>Agreements</h2><div id="ag"></div>';agree()}).catch(function(e){if(e.status===401){$("main").innerHTML='<div class="card"><p>Sign in to see your coins.</p><button id="si">Sign in / Create account</button></div>';$("si").onclick=function(){PM.login(go)}}else $("main").innerHTML='<div class="card err">'+esc(e.message)+'</div>'})}
function agree(){PM.api("music-coins",{action:"c_list"}).then(function(j){
 var h='';if(j.to_sign.length)h+='<div class="card" style="border-color:var(--gold)"><b>Waiting for your signature</b>'+j.to_sign.map(function(x){return'<div class="row" style="justify-content:space-between;margin-top:6px"><span>'+esc(x.title)+'</span><a class="btn" href="'+esc(x.link)+'">Review &amp; sign</a></div>'}).join("")+'</div>';
 h+='<div class="card"><b>Agreements you sent</b>'+(j.created.length?j.created.map(function(c){var s=c.music_contract_parties.filter(function(p){return p.signed_at}).length;return'<div class="row" style="justify-content:space-between;margin-top:6px"><span>'+esc(c.title)+'<br><small class="muted">'+esc(c.status)+' · '+s+' of '+c.music_contract_parties.length+' signed</small></span><button class="alt" data-c="'+c.id+'">Open</button></div>'}).join(""):'<div class="muted">None yet.</div>')+'<div class="row" style="margin-top:10px"><button id="newc">Send a new agreement</button></div><div id="cbox"></div></div>';
 $("ag").innerHTML=h;$("newc").onclick=newc;[].forEach.call(document.querySelectorAll("[data-c]"),function(b){b.onclick=function(){openc(b.dataset.c)}})}).catch(function(){})}
function newc(){PM.api("music-coins",{action:"c_templates"}).then(function(t){$("cbox").innerHTML='<div class="card"><select id="ct"><option value="">Write my own</option>'+t.templates.map(function(x){return'<option value="'+esc(x.key)+'">'+esc(x.title)+'</option>'}).join("")+'</select><input id="cti" placeholder="Title"><textarea id="cb" rows="8" placeholder="Agreement text. Use your own reviewed wording."></textarea><small class="muted">Signers: one per line as  Name, email, role</small><textarea id="cp" rows="3" placeholder="Jane Doe, jane@example.com, songwriter"></textarea><button id="cs">Create &amp; get signing links</button><div id="cout"></div></div>';
 $("ct").onchange=function(){var x=t.templates.filter(function(y){return y.key===$("ct").value})[0];if(x){$("cti").value=x.title;$("cb").value=x.body}};
 $("cs").onclick=function(){var ps=$("cp").value.split("\n").map(function(l){var a=l.split(",").map(function(z){return z.trim()});return a[1]?{name:a[0],email:a[1],role:a[2]||""}:null}).filter(Boolean);
  PM.api("music-coins",{action:"c_create",template_key:$("ct").value||undefined,title:$("cti").value,body:$("cb").value,parties:ps}).then(function(r){$("cout").innerHTML='<p><b>Created.</b> Send each person their own link:</p>'+r.links.map(function(l){return'<p>'+esc(l.name)+' ('+esc(l.email)+')<br><input readonly value="'+esc(location.origin+l.link)+'" onclick="this.select()"></p>'}).join("")}).catch(function(e){PM.toast(e.message)})}})}
function openc(id){PM.api("music-coins",{action:"c_get",id:id}).then(function(j){var c=j.contract;$("cbox").innerHTML='<div class="card"><b>'+esc(c.title)+'</b> <span class="st">'+esc(c.status)+'</span>'+c.parties.map(function(p){return'<div class="row" style="justify-content:space-between;margin-top:6px"><span>'+esc(p.name)+' <small class="muted">'+esc(p.email)+'</small></span><span>'+(p.signed?'Signed '+new Date(p.signed_at).toLocaleDateString():'<input readonly value="'+esc(location.origin+p.link)+'" onclick="this.select()" style="width:200px">')+'</span></div>'}).join("")+(c.status==="pending"?'<button class="alt" id="vd" style="margin-top:8px">Cancel this agreement</button>':'')+(j.final_html?'<button id="fd" style="margin-top:8px">Download final record</button>':'')+'<small class="muted" style="display:block;margin-top:6px">Document hash: '+esc(c.body_hash)+'</small></div>';
 if($("vd"))$("vd").onclick=function(){PM.api("music-coins",{action:"c_void",id:id}).then(go).catch(function(e){PM.toast(e.message)})};
 if($("fd"))$("fd").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([j.final_html],{type:"text/html"}));a.download="agreement-"+id.slice(0,8)+".html";a.click()}}).catch(function(e){PM.toast(e.message)})}
go();
</script></body></html>
