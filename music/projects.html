<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark light"><link rel="icon" href="data:,">
<title>My Projects — POTENT Music</title><link rel="stylesheet" href="/music/base.css"></head><body>
<script src="/music/nav.js"></script>
<h1>My <span>Projects</span></h1>
<div class="muted">Turn a beat into a release: add your team, agree on splits for each type of income, and keep the records in one place. <a href="/music/guide.html">New here? Start with the guide.</a></div>
<div id="main" style="margin-top:12px"><div class="muted">Loading…</div></div>
<script src="/music/common.js"></script>
<script>
function $(i){return document.getElementById(i)}var esc=PM.esc,usd=function(c){return"$"+(c/100).toFixed(2)};
var CATS={master:"Master recording",publishing:"Songwriting / publishing",beat_sale:"Beat sale proceeds",promo:"DJ / promotion",other:"Other agreed income"};
var ROLES=["lead_artist","featured_artist","producer","co_producer","songwriter","composer","engineer","dj","promoter","manager","other"];
var P=null,LIST=null,MODE="guided",NEXT=null,ALL=false;
function api(a){return PM.api("music-rights",a)}
function home(){api({action:"p_list"}).then(function(j){LIST=j;P=null;drawList()}).catch(function(e){if(e.status===401)gate();else $("main").innerHTML='<div class="card err">'+esc(e.message)+'</div>'})}
function gate(){$("main").innerHTML='<div class="card"><p>Sign in to manage your projects.</p><button id="si">Sign in / Create account</button></div>';$("si").onclick=function(){PM.login(home)}}
function drawList(){var h='<div class="card"><b>New project</b><input id="pt" placeholder="Song or project name"><select id="ps"><option value="">Not linked to a beat purchase</option>'+LIST.purchases.map(function(s){return'<option value="'+s.id+'">From purchase: '+esc(s.title||"Beat")+'</option>'}).join("")+'</select><button id="pc">Create</button></div>';
 h+='<h2>Your projects</h2>'+(LIST.projects.length?LIST.projects.map(function(p){return'<div class="card row" style="justify-content:space-between"><b>'+esc(p.title)+'</b><button data-open="'+p.id+'">Open</button></div>'}).join(""):'<div class="muted">No projects yet.</div>');
 $("main").innerHTML=h;$("pc").onclick=function(){api({action:"p_create",title:$("pt").value,beat_sale_id:$("ps").value||undefined}).then(function(j){open(j.id)}).catch(function(e){PM.toast(e.message)})};
 [].forEach.call(document.querySelectorAll("[data-open]"),function(b){b.onclick=function(){open(b.dataset.open)}})}
function open(id){Promise.all([api({action:"p_get",project_id:id}),api({action:"p_ai_next",project_id:id}),api({action:"u_mode"})]).then(function(r){P=r[0];NEXT=r[1].next;MODE=r[2].mode;draw()}).catch(function(e){PM.toast(e.message)})}
function topCard(){var n=NEXT,c=P.checklist,done=c.filter(function(x){return x.s==="COMPLETED"}).length;
 return'<div class="card" style="border-color:var(--gold)"><small class="muted">Your next move · '+done+' of '+c.length+' steps done</small><div style="font-size:19px;font-weight:700;margin:4px 0">'+esc(n.title)+'</div><div>'+esc(n.why)+'</div>'+(n.action?'<div class="row" style="margin-top:8px"><button data-go="'+n.action.go+'">'+esc(n.action.label)+'</button><button class="alt" id="simp">Say it simpler</button></div><div id="adv" class="muted" style="margin-top:6px"></div>':'')+
  '<div class="row" style="margin-top:10px"><input id="askq" placeholder="Ask: who still needs to approve? what have I been paid?" style="flex:1 1 220px"><button class="alt" id="mic" title="Speak">🎤</button><button class="alt" id="askb">Ask</button></div><div id="askr" class="muted" style="margin-top:6px"></div>'+
  '<div class="row" style="margin-top:8px"><label><small class="muted">Help level </small><select id="mode" style="width:auto"><option value="quick">Quick: one step at a time</option><option value="guided">Guided: step by step</option><option value="advanced">Advanced: everything</option></select></label></div></div>'}
function badge(s){var c={COMPLETED:"#2ecc71","IN PROGRESS":"#f1c40f","ACTION REQUIRED":"#e74c3c","NOT STARTED":"#888"}[s]||"#888";return'<span class="st" style="border-color:'+c+';color:'+c+'">'+s+'</span>'}
function draw(){var p=P.project,h='<div class="row"><button class="alt" id="back">← All projects</button><b style="font-size:20px">'+esc(p.title)+'</b></div>'+topCard();
 if(MODE==='quick'&&!ALL){$("main").innerHTML=h+'<div class="row" style="margin-top:10px"><button class="alt" id="all">Show everything</button></div>';wire();return}
 h+='<div class="card"><b>Where you are</b>'+P.checklist.map(function(c){return'<div class="row" style="justify-content:space-between;margin-top:6px"><span>'+esc(c.t)+'</span>'+badge(c.s)+'</div>'}).join("")+'</div>';
 h+='<div class="card"><b>1. Your team</b><small class="muted"> One person can have several roles. They are never counted twice.</small>'+(p.contributors.length?'<table>'+p.contributors.map(function(c){return'<tr><td>'+esc(c.name)+'<br><small class="muted">'+esc(c.email)+' · '+esc(c.roles.join(", ")||"no role yet")+'</small></td><td><button class="alt" data-rm="'+c.id+'">Remove</button></td></tr>'}).join("")+'</table>':'<div class="muted">Add the first person (you can add yourself).</div>')+
  '<div class="row" style="margin-top:8px"><input id="cn" placeholder="Name" style="flex:1 1 140px"><input id="ce" type="email" placeholder="Email" style="flex:1 1 180px"></div><div class="row">'+ROLES.map(function(r){return'<label class="ck" style="margin:2px 8px 2px 0"><input type="checkbox" data-role="'+r+'" style="width:auto"><span>'+r.replace("_"," ")+'</span></label>'}).join("")+'</div><button id="ca">Add person</button></div>';
 h+='<div class="card"><b>2. Splits (each type of income has its own sheet)</b><div class="muted"><small>Master = the recording. Publishing = the song itself. They are agreed separately. Nothing is allocated until everyone on a split approves it.</small></div>';
 var by={};p.schedules.forEach(function(s){(by[s.category]=by[s.category]||[]).push(s)});
 Object.keys(by).forEach(function(k){h+='<h3>'+CATS[k]+'</h3>'+by[k].map(function(s){var nm=function(id){var c=p.contributors.filter(function(x){return x.id===id})[0];return c?c.name:"?"};return'<div class="beat" style="align-items:flex-start"><div class="bi"><b>Version '+s.version+'</b> '+badge(s.status==="approved"?"COMPLETED":s.status==="disputed"?"ACTION REQUIRED":s.status==="draft"?"NOT STARTED":s.status==="superseded"?"NOT STARTED":"IN PROGRESS")+' <small class="muted">'+s.status+' · based on '+(s.base==="gross"?"gross":"net eligible")+' receipts</small><br><small>'+s.music_schedule_lines.map(function(l){var a=s.music_schedule_approvals.filter(function(x){return x.contributor_id===l.contributor_id})[0];return esc(nm(l.contributor_id))+' '+l.pct+'%'+(a?(a.decision==="approved"?' ✓':' ⚠ disputed'+(a.note?' ("'+esc(a.note)+'")':'')):'')}).join(" · ")+'</small></div>'+(s.status==="draft"?'<button data-sub="'+s.id+'">Send for approval</button>':'')+'</div>'}).join("")});
 h+='<h3>New or changed split</h3><select id="sc">'+Object.keys(CATS).map(function(k){return'<option value="'+k+'">'+CATS[k]+'</option>'}).join("")+'</select><select id="sb"><option value="net_eligible">Shares apply to net eligible receipts (after allowed costs)</option><option value="gross">Shares apply to gross receipts</option></select><input id="sd" placeholder="Which costs may be deducted? (write it out so everyone agrees)">'+
  (p.contributors.length?'<div class="muted"><small>Percent for each person. They must total exactly 100.</small></div>'+p.contributors.map(function(c){return'<div class="row"><span style="flex:1 1 140px">'+esc(c.name)+'</span><input data-pct="'+c.id+'" inputmode="decimal" placeholder="0" style="flex:0 1 90px"></div>'}).join("")+'<div class="row"><input id="ait" placeholder="Or describe it and let AI draft the numbers (e.g. Breeze 1, POTENT 1, rest to the artist)" style="flex:1 1 260px"><button class="alt" id="aid">✨ Draft</button></div><div id="tot" class="muted"></div><button id="ss">Save draft</button><div id="serr" class="err"></div>':'<div class="muted">Add your team first.</div>')+'<div id="links"></div></div>';
 h+='<div class="card"><b>3. Money in (recorded, not paid out)</b><div class="muted"><small>Add income only from a real source, like a statement or a bank reference. Master income is never reduced by the beat marketplace fee. Calculated is not the same as received.</small></div>'+p.revenue.map(function(r){return'<div class="beat" style="align-items:flex-start"><div class="bi"><b>'+CATS[r.category]+'</b> '+usd(r.eligible_cents)+' eligible <span class="st">'+r.source.replace("_"," ")+'</span> <span class="st">'+r.status+'</span><br><small class="muted">'+esc(r.reference||"")+' · split v'+r.schedule_version+' · '+r.music_allocations.map(function(a){var c=p.contributors.filter(function(x){return x.id===a.contributor_id})[0];return esc(c?c.name:"?")+" "+usd(a.cents)}).join(", ")+'</small></div>'+(r.status==="calculated"&&r.source!=="self_reported"?'<button class="alt" data-rc="'+r.id+'">Mark received</button>':'')+'</div>'}).join("")+
  '<div class="row" style="margin-top:8px"><select id="rcat">'+Object.keys(CATS).map(function(k){return'<option value="'+k+'">'+CATS[k]+'</option>'}).join("")+'</select><select id="rsrc"><option value="statement">From a statement / bank record</option><option value="self_reported">Self-reported (not verified)</option></select></div><div class="row"><input id="ram" inputmode="decimal" placeholder="Amount received $"><input id="rde" inputmode="decimal" placeholder="Allowed costs $ (optional)"><input id="rrf" placeholder="Statement or reference"></div><button id="ra">Record income</button><div id="rerr" class="err"></div></div>';
 h+='<div class="row"><button class="alt" id="csv">Download split sheet (CSV)</button></div>';
 $("main").innerHTML=h;wire()}
function pn(v){var x=parseFloat(String(v).replace(/[$,\s]/g,""));return isFinite(x)?x:0}
function wire(){var p=P.project;$("back").onclick=home;
 if($("all"))$("all").onclick=function(){ALL=true;draw()};
 $("mode").value=MODE;$("mode").onchange=function(){MODE=$("mode").value;ALL=false;api({action:"u_mode",mode:MODE}).catch(function(){});draw()};
 [].forEach.call(document.querySelectorAll("[data-go]"),function(b){b.onclick=function(){ALL=true;draw();var t={team:"Your team",splits:"Splits",money:"Money in"}[b.dataset.go];var h=[].filter.call(document.querySelectorAll(".card b"),function(x){return x.textContent.indexOf(t)>=0})[0];if(h)h.scrollIntoView()}});
 if($("simp"))$("simp").onclick=function(){$("adv").textContent="One moment…";api({action:"p_ai_next",project_id:p.id,simple:true}).then(function(j){$("adv").textContent=j.simple?"✨ "+j.simple:(j.next.aiNote||"Simpler wording is not available right now.")}).catch(function(e){$("adv").textContent=e.message})};
 $("askb").onclick=function(){$("askr").textContent="…";api({action:"p_ask",project_id:p.id,text:$("askq").value}).then(function(j){$("askr").textContent=(j.source==="ai"?"✨ ":"")+j.answer}).catch(function(e){$("askr").textContent=e.message})};
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)$("mic").style.display="none";else $("mic").onclick=function(){var r=new SR();r.lang="en-US";r.onresult=function(e){$("askq").value=e.results[0][0].transcript;$("askb").click()};r.onerror=function(){PM.toast("Could not hear that")};r.start()};
 $("ca").onclick=function(){var roles=[].filter.call(document.querySelectorAll("[data-role]"),function(c){return c.checked}).map(function(c){return c.dataset.role});api({action:"p_contrib_add",project_id:p.id,name:$("cn").value,email:$("ce").value,roles:roles}).then(function(){open(p.id)}).catch(function(e){PM.toast(e.message)})};
 [].forEach.call(document.querySelectorAll("[data-rm]"),function(b){b.onclick=function(){api({action:"p_contrib_remove",project_id:p.id,id:b.dataset.rm}).then(function(){open(p.id)}).catch(function(e){PM.toast(e.message)})}});
 var tot=function(){var s=0;[].forEach.call(document.querySelectorAll("[data-pct]"),function(i){s+=pn(i.value)});if($("tot"))$("tot").textContent="Total: "+Math.round(s*10000)/10000+"% "+(Math.round(s*10000)===1000000?"✓":"(must be exactly 100)")};
 [].forEach.call(document.querySelectorAll("[data-pct]"),function(i){i.oninput=tot});tot();
 if($("aid"))$("aid").onclick=function(){api({action:"p_ai_split",project_id:p.id,text:$("ait").value}).then(function(j){if(!j.draft.length)PM.toast("Could not read that. Type the numbers in yourself.");j.draft.forEach(function(d){var i=document.querySelector('[data-pct="'+d.contributor_id+'"]');if(i)i.value=d.pct});tot();PM.toast(j.note)}).catch(function(e){PM.toast(e.message)})};
 if($("ss"))$("ss").onclick=function(){var lines=[].map.call(document.querySelectorAll("[data-pct]"),function(i){return{contributor_id:i.dataset.pct,pct:pn(i.value)}}).filter(function(l){return l.pct>0});api({action:"p_schedule_save",project_id:p.id,category:$("sc").value,base:$("sb").value,deductions:$("sd").value,lines:lines}).then(function(){open(p.id)}).catch(function(e){$("serr").textContent=e.message})};
 [].forEach.call(document.querySelectorAll("[data-sub]"),function(b){b.onclick=function(){api({action:"p_schedule_submit",project_id:p.id,id:b.dataset.sub}).then(function(j){$("links").innerHTML='<div class="card"><b>Send each person their link</b><br><small class="muted">'+esc(j.note)+'</small>'+j.links.map(function(l){return'<div style="margin-top:8px"><b>'+esc(l.name)+'</b><br><input readonly value="'+esc(l.url)+'" onclick="this.select()"></div>'}).join("")+'</div>';$("links").scrollIntoView()}).catch(function(e){PM.toast(e.message)})}});
 [].forEach.call(document.querySelectorAll("[data-rc]"),function(b){b.onclick=function(){api({action:"p_revenue_receive",project_id:p.id,id:b.dataset.rc}).then(function(){open(p.id)}).catch(function(e){PM.toast(e.message)})}});
 $("ra").onclick=function(){api({action:"p_revenue_add",project_id:p.id,category:$("rcat").value,source:$("rsrc").value,gross_cents:Math.round(pn($("ram").value)*100),deductions_cents:Math.round(pn($("rde").value)*100),reference:$("rrf").value}).then(function(){open(p.id)}).catch(function(e){$("rerr").textContent=e.message})};
 $("csv").onclick=function(){api({action:"p_split_sheet",project_id:p.id}).then(function(j){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([j.csv],{type:"text/csv"}));a.download="split-sheet.csv";document.body.appendChild(a);a.click();a.remove()})}}
PM.onAuth=home;PM.wire();PM.loadMe().then(function(m){if(m)home();else gate()});
</script></body></html>
