var currentUser=null;
var revokedUsers={};
var displayNames={};

// Load display names from Supabase
async function loadDisplayNames(){
  try{
    var res=await fetch(SUPABASE_URL+'/rest/v1/user_display_names?select=user_id,name',{
      headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}
    });
    var data=await res.json();
    if(Array.isArray(data)){
      data.forEach(function(r){displayNames[r.user_id]=r.name;});
      // Update dropdown labels
      Object.keys(displayNames).forEach(function(uid){
        var opt=document.querySelector('#staffSelect option[value="'+uid+'"]');
        if(opt)opt.textContent=displayNames[uid];
      });
    }
  }catch(e){}
}

// Load revoked users from Supabase
async function loadRevokedUsers(){
  try{
    var res=await fetch(SUPABASE_URL+'/rest/v1/revoked_users?select=user_id',{
      headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}
    });
    var data=await res.json();
    revokedUsers={};
    if(Array.isArray(data)){data.forEach(function(r){revokedUsers[r.user_id]=true;});}
  }catch(e){}
}

function getDisplayName(uid){return USERS[uid]?.name||uid;}

function buildLoginDropdown(){
  var sel=document.getElementById('staffSelect');
  if(!sel)return;
  sel.innerHTML='<option value="">— Select your name —</option>';
  // Owner
  var og0=document.createElement('optgroup');og0.label='Owner';
  var o=document.createElement('option');o.value='potent';o.textContent='👑 '+getDisplayName('potent');og0.appendChild(o);
  sel.appendChild(og0);
  // Group active slots by type
  var types={closer:[],dispatcher:[],driver:[]};
  Object.keys(USERS).filter(function(uid){return uid!=='potent';}).forEach(function(uid){
    var u=USERS[uid];
    var t=u.type||'dispatcher';
    if(types[t]) types[t].push(uid);
    else types.dispatcher.push(uid);
  });
  var groups=[['closer','🤝 Closers'],['dispatcher','📞 Dispatch'],['driver','🚐 Drivers']];
  groups.forEach(function(g){
    var slots=types[g[0]].filter(function(uid){return USERS[uid].name&&!USERS[uid].name.startsWith('Slot ')&&!USERS[uid].name.startsWith('Driver ');});
    var unset=types[g[0]].filter(function(uid){return !slots.includes(uid);});
    // Show named slots first, then unset
    var all=[...slots,...unset];
    if(all.length===0)return;
    var og=document.createElement('optgroup');og.label=g[1];
    all.forEach(function(uid){

    });
    sel.appendChild(og);
  });
}

// ── TAB DEFINITIONS BY ROLE ──────────────────────────────────────
function getTabs(){
  var all=[
    {id:'welcome',label:'Welcome',roles:['owner','dispatch','driver']},
    {id:'apps',label:'Apps & Links',roles:['owner','dispatch','driver']},
    {id:'handbook',label:'Handbook',roles:['owner','dispatch','driver']},
    {id:'sales',label:'Sales',roles:['owner','dispatch']},
    {id:'leads',label:'Leads',roles:['owner','dispatch']},
    {id:'dispatch',label:'Dispatch',roles:['owner','dispatch']},
    {id:'drivers',label:'Drivers',roles:['owner','driver']},
    {id:'compliance',label:'Compliance',roles:['owner','driver']},
    {id:'rules',label:'Rules',roles:['owner','dispatch','driver']},
    {id:'training',label:'🎯 OS Training',roles:['owner','dispatch','driver']},{id:'sign',label:'Sign',roles:['owner','dispatch','driver']},
    {id:'admin',label:'⚙ Admin',roles:['owner']},
  ];
  return all.filter(function(t){return t.roles.indexOf(currentUser.role)>-1;});
}

window.addEventListener('DOMContentLoaded',function(){
  loadSlotData();
  buildLoginDropdown();
});
function buildTabs(){
  var tabs=getTabs();
  var navEl=document.getElementById('navTabs');
  var panelEl=document.getElementById('tabPanels');
  navEl.innerHTML='';
  panelEl.innerHTML='';
  tabs.forEach(function(t,i){
    var btn=document.createElement('button');
    btn.className='tab-btn'+(i===0?' active':'');
    btn.textContent=t.label;
    btn.onclick=function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
      document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
      btn.classList.add('active');
      document.getElementById('panel-'+t.id).classList.add('active');
    };
    navEl.appendChild(btn);
    var panel=document.createElement('div');
    panel.className='tab-panel'+(i===0?' active':'');
    panel.id='panel-'+t.id;
    panel.innerHTML=getContent(t.id);
    panelEl.appendChild(panel);
  });
  // Init admin panel if owner
  if(currentUser.role==='owner'){renderAdminPanel();}
}

function getContent(id){
  switch(id){
    case 'welcome': return contentWelcome();

    // Title
    var title=document.createElement('div');
    title.style.cssText='font-size:11px;color:#F0E000;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;';
    title.textContent='Edit Employee Names & Roles';
    el.appendChild(title);
    var sub=document.createElement('div');
    sub.style.cssText='font-size:11px;color:#555;margin-bottom:14px;';
    sub.textContent='Rename any slot when someone joins or leaves. Change their role type. Saves instantly.';
    el.appendChild(sub);

    // Slots
    Object.keys(USERS).filter(function(uid){return uid!=='potent';}).forEach(function(uid){
      var u=USERS[uid];
      var row=document.createElement('div');
      row.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:8px;background:#0d0d0d;border:1px solid #1a1a1a;border-radius:8px;padding:8px 10px;';

      var pwLabel=document.createElement('div');
      pwLabel.style.cssText='font-size:9px;color:#333;width:80px;flex-shrink:0;font-family:monospace;line-height:1.3;';
      pwLabel.textContent=u.pw;
      row.appendChild(pwLabel);

      var nameInput=document.createElement('input');
      nameInput.id='name_'+uid;
      nameInput.value=isDefaultName(u.name)?'':u.name;
      nameInput.placeholder='Enter name...';
      nameInput.style.cssText='flex:1;background:#060606;border:1px solid #222;border-radius:6px;color:#F2F2F2;padding:6px 9px;font-size:12px;outline:none;font-family:inherit;min-width:0;';
      row.appendChild(nameInput);

      var typeSelect=document.createElement('select');
      typeSelect.id='type_'+uid;
      typeSelect.style.cssText='background:#060606;border:1px solid #222;border-radius:6px;color:#F2F2F2;padding:6px 8px;font-size:11px;outline:none;font-family:inherit;color-scheme:dark;flex-shrink:0;';
      ['dispatcher','closer','driver'].forEach(function(t){
        var opt=document.createElement('option');
        opt.value=t; opt.textContent=TYPE_LABEL[t]||t;
        if(u.type===t||((!u.type)&&t==='dispatcher'))opt.selected=true;
        typeSelect.appendChild(opt);
      });
      row.appendChild(typeSelect);

      var saveBtn=document.createElement('button');
      saveBtn.textContent='Save';
      saveBtn.style.cssText='background:#F0E000;color:#000;border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;';
      saveBtn.addEventListener('click',function(){
        var newName=nameInput.value.trim();
        var newType=typeSelect.value;
        if(!newName){alert('Enter a name for this slot.');return;}
        USERS[uid].name=newName;
        USERS[uid].type=newType;
        USERS[uid].role=newType==='driver'?'driver':'dispatch';
        USERS[uid].emoji=TYPE_EMOJI[newType]||'📞';
        saveSlotData();
        buildLoginDropdown();
        saveBtn.textContent='✓ Saved';
        saveBtn.style.background='#1DB954';
        setTimeout(function(){saveBtn.textContent='Save';saveBtn.style.background='#F0E000';},2000);
      });
      row.appendChild(saveBtn);
      el.appendChild(row);
    });

    var note=document.createElement('div');
    note.style.cssText='font-size:10px;color:#333;margin-top:4px;margin-bottom:20px;';
    note.textContent='Passwords: DISPATCH1PL–DISPATCH20PL · DRIVERPL, DRIVER2PL, DRIVER3PL';
    el.appendChild(note);

    // Revoke section
    var revokeTitle=document.createElement('div');
    revokeTitle.style.cssText='font-size:11px;color:#E53E3E;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;border-top:1px solid #1a1a1a;padding-top:16px;';
    revokeTitle.textContent='Access Control — Revoke / Restore';
    el.appendChild(revokeTitle);

    Object.keys(USERS).filter(function(uid){return uid!=='potent';}).forEach(function(uid){
      var u=USERS[uid];
      if(isDefaultName(u.name))return;
      var rRow=document.createElement('div');
      rRow.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #111;';
      var rName=document.createElement('div');
      rName.style.cssText='font-size:12px;color:#F2F2F2;';
      rName.textContent=(TYPE_EMOJI[u.type||'dispatcher']||'📞')+' '+u.name;
      var rBtn=document.createElement('button');
      rBtn.id='revoke_'+uid;
      rBtn.textContent='Revoke';
      rBtn.style.cssText='background:transparent;border:1px solid #E53E3E;color:#E53E3E;border-radius:6px;padding:4px 10px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;';
      rBtn.addEventListener('click',function(){toggleRevoke(uid,rBtn);});
      rRow.appendChild(rName); rRow.appendChild(rBtn);
      el.appendChild(rRow);
    });
  }

  buildAdminUI();

  window.saveSlot=function(uid){
    var nameEl=document.getElementById('name_'+uid);
    var typeEl=document.getElementById('type_'+uid);
    if(!nameEl||!typeEl)return;
    var newName=nameEl.value.trim();
    var newType=typeEl.value;
    if(!newName){alert('Enter a name for this slot.');return;}
    USERS[uid].name=newName;
    USERS[uid].type=newType;
    USERS[uid].role=newType==='driver'?'driver':'dispatch';
    USERS[uid].emoji=TYPE_EMOJI[newType]||'📞';
    saveSlotData();
    buildLoginDropdown();
    // Flash confirm
    var btn=nameEl.parentElement.querySelector('button');
    if(btn){btn.textContent='✓ Saved';btn.style.background='#1DB954';setTimeout(function(){btn.textContent='Save';btn.style.background='#F0E000';},2000);}
  };

  window.toggleRevoke=async function(uid,btn){
    if(!btn)btn=document.getElementById('revoke_'+uid);
    if(!btn)return;
    var isRevoked=btn.textContent==='Restore';
    var action=isRevoked?'DELETE':'POST';
    var url=SUPABASE_URL+'/rest/v1/revoked_users';
    if(action==='DELETE') url+='?user_id=eq.'+uid;
    try{
      await fetch(url,{method:action,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:action==='POST'?JSON.stringify({user_id:uid,revoked_by:'Owner',reason:'Admin revoked'}):undefined});
      btn.textContent=isRevoked?'Revoke':'Restore';
      btn.style.borderColor=isRevoked?'#E53E3E':'#1DB954';
      btn.style.color=isRevoked?'#E53E3E':'#1DB954';
    }catch(e){alert('Error updating access. Check connection.');}
  };
}
async function saveName(uid){
  var input=document.getElementById('rename-'+uid);
  var newName=input.value.trim();
  if(!newName)return;
  try{
    await fetch(SUPABASE_URL+'/rest/v1/user_display_names',{
      method:'POST',
      headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},
      body:JSON.stringify({user_id:uid,name:newName})
    });
    displayNames[uid]=newName;
    var nameEl=document.querySelector('#empcard-'+uid+' .emp-name');
    if(nameEl)nameEl.textContent=USERS[uid].emoji+' '+newName;
    // Update dropdown
    var opt=document.querySelector('#staffSelect option[value="'+uid+'"]');
    if(opt)opt.textContent=newName;
    alert('Name updated to "'+newName+'"');
  }catch(e){alert('Failed to save name. Check connection.');}
}

var pendingRevokeUid=null;
function confirmRevoke(uid,name){
  pendingRevokeUid=uid;
  document.getElementById('confirmTitle').textContent='Revoke Access — '+name;
  document.getElementById('confirmMsg').innerHTML='Are you sure you want to revoke access for <strong style="color:#F2F2F2">'+name+'</strong>?<br><br>This takes effect immediately. They will not be able to log in. You can restore access at any time.';
  document.getElementById('confirmYes').textContent='Yes, Revoke Access';
  document.getElementById('confirmYes').onclick=doRevoke;
  document.getElementById('confirmModal').classList.add('show');
}

async function doRevoke(){
  closeConfirm();
  var uid=pendingRevokeUid;
  var name=getDisplayName(uid);
  try{
    await fetch(SUPABASE_URL+'/rest/v1/revoked_users',{
      method:'POST',
      headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},
      body:JSON.stringify({user_id:uid,revoked_by:'Owner',reason:'Revoked via Employee Portal'})
    });
    revokedUsers[uid]=true;
    var badge=document.getElementById('badge-'+uid);
    if(badge){badge.textContent='REVOKED';badge.className='status-badge status-revoked';}
    var actions=document.getElementById('actions-'+uid);
    if(actions){
      var revokeBtn=actions.querySelector('.btn-revoke');
      if(revokeBtn){revokeBtn.textContent='✅ Restore Access';revokeBtn.className='action-btn btn-restore';revokeBtn.onclick=function(){restoreAccess(uid);};}
    }
    alert(name+' has been revoked. They cannot log in until access is restored.');
  }catch(e){alert('Failed to revoke. Check connection.');}
}

async function restoreAccess(uid){
  var name=getDisplayName(uid);
  if(!confirm('Restore access for '+name+'? They will be able to log in immediately.'))return;
  try{
    await fetch(SUPABASE_URL+'/rest/v1/revoked_users?user_id=eq.'+uid,{
      method:'DELETE',
      headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}
    });
    delete revokedUsers[uid];
    var badge=document.getElementById('badge-'+uid);
    if(badge){badge.textContent='ACTIVE';badge.className='status-badge status-active';}
    var actions=document.getElementById('actions-'+uid);
    if(actions){
      var restoreBtn=actions.querySelector('.btn-restore');
      if(restoreBtn){restoreBtn.textContent='🚫 Revoke Access';restoreBtn.className='action-btn btn-revoke';restoreBtn.onclick=function(){confirmRevoke(uid,name);};}
    }
    alert(name+' can now log in again.');
  }catch(e){alert('Failed to restore. Check connection.');}
}

function closeConfirm(){
  document.getElementById('confirmModal').classList.remove('show');
  pendingRevokeUid=null;
}

// ── INIT ─────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',async function(){
  await loadDisplayNames();
  await loadRevokedUsers();
  // Check for existing session
  try{
    var saved=JSON.parse(localStorage.getItem('potent_portal_session')||'null');
    if(saved&&saved.uid&&USERS[saved.uid]){
      if(!revokedUsers[saved.uid]){
        currentUser={uid:saved.uid,role:USERS[saved.uid].role,displayName:getDisplayName(saved.uid)};
        launchApp();
        return;
      }
    }
  }catch(e){}
  document.getElementById('loginScreen').style.display='flex';
});
</script>
