<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="color-scheme" content="dark light"><link rel="icon" href="data:,">
<title>POTENT Studio — Creators</title><link rel="stylesheet" href="/music/base.css">
<style>table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}.pill{display:inline-block;padding:1px 9px;border-radius:99px;border:1px solid var(--line);font-size:12px}.hide{display:none}.err{color:#e74c3c;min-height:20px}label{display:block;font-size:13px;color:var(--muted);margin-top:6px}.ck{display:flex;gap:8px;align-items:flex-start}</style></head><body>
<script src="/music/nav.js"></script>
<h1>POTENT <span>STUDIO</span></h1>
<div class="muted">Upload songs, downloads and videos. Everything you submit is reviewed by POTENT before it goes live.</div>
<div id="login" class="card"><div class="row"><button id="tP">Creator login</button><button class="alt" id="tO">POTENT owner</button></div>
<div id="fP"><input id="pe" placeholder="Email" autocapitalize="none"><input id="pp" type="password" placeholder="Password"><button id="gP">Sign in</button></div>
<div id="fO" class="hide"><input id="oi" value="potent"><input id="op" type="password" placeholder="Password"><button id="gO">Owner sign in</button></div><div class="err" id="le"></div><small class="muted">New here? <a href="/beats/apply.html">Apply to sell</a>. Buyers: your library is under Account.</small></div>
<div id="app" class="hide"></div>
<script>
var tok="",mode="",D=null,Q=null,ST=null,TAB="profile";
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function usd(c){return"$"+((c||0)/100).toFixed(2)}
function call(fn,a,b){return fetch("/.netlify/functions/"+fn,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify(Object.assign({action:a},b||{}))}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Something went wrong");return j})})}
var RIGHTS="The buyer may use this file in their own recordings and releases. Ownership of the underlying composition and any publishing share stays with the seller unless stated here.";
var FIELDS={
 track:[{k:"title",l:"Song title"},{k:"album",l:"Album / EP (optional)"},{k:"genre",l:"Genre"},{k:"mood",l:"Mood"},{k:"release_date",l:"Release date",t:"date"},{k:"explicit",l:"Explicit",t:"check"},{k:"description",l:"Description",t:"area"},{k:"collaborators",l:"Credits &amp; splits (one per line: Name | Role | Percent, must total 100; a record shown on the listing, payouts follow POTENT fee rules)",t:"collab"},{k:"audio_url",l:"Audio file (MP3/WAV/M4A)",t:"file",fk:"audio"},{k:"cover_url",l:"Cover art",t:"file",fk:"cover"}],
 product:[{k:"title",l:"Title"},{k:"kind",l:"Type",t:"sel",o:["album","sample_pack","preset","stems","project_file","bundle","video","digital"]},{k:"price_cents",l:"Price $ (you set it, $1 minimum)",t:"money"},{k:"limited_qty",l:"Limited drop: how many copies? (blank = unlimited)"},{k:"description",l:"Description",t:"area"},{k:"tags",l:"Tags, comma separated",t:"tags"},{k:"rights_text",l:"What the buyer is allowed to do (shown before they pay)",t:"area",d:RIGHTS},{k:"sample_disclosure",l:"Samples / third-party material used, and whether cleared (blank if none)",t:"area"},{k:"rights_confirmed",l:"I own, or am authorized to sell, everything in this product",t:"check"},{k:"publish_at",l:"Schedule release (optional)",t:"dt"},{k:"preorder",l:"Sell as a preorder before the release date (buyers pay now, download unlocks on release)",t:"check"},{k:"collaborators",l:"Credits &amp; splits (one per line: Name | Role | Percent, must total 100; a record shown on the listing, payouts follow POTENT fee rules)",t:"collab"},{k:"file_ref",l:"The file buyers receive (ZIP/MP3/WAV/PDF)",t:"file",fk:"file"},{k:"preview_url",l:"Preview audio (optional)",t:"file",fk:"audio"},{k:"cover_url",l:"Cover art",t:"file",fk:"cover"}],
 video:[{k:"title",l:"Video title"},{k:"description",l:"Description",t:"area"},{k:"video_url",l:"YouTube / Vimeo link, or upload a file below (50 MB max)"},{k:"upload",l:"Upload video file (optional)",t:"file",fk:"video",to:"video_url"},{k:"thumb_url",l:"Thumbnail",t:"file",fk:"cover"}]};
var TNAME={track:"Songs",product:"Downloads",video:"Videos"},LIST={track:"tracks",product:"products",video:"videos"};

$("tP").onclick=function(){$("fP").classList.remove("hide");$("fO").classList.add("hide")};$("tO").onclick=function(){$("fO").classList.remove("hide");$("fP").classList.add("hide")};
$("gP").onclick=function(){$("le").textContent="";call("beat-api","login",{email:$("pe").value,password:$("pp").value}).then(function(j){tok=j.token;mode="p";try{sessionStorage.setItem("st",JSON.stringify({t:tok,m:mode}))}catch(e){}return load()}).catch(function(e){$("le").textContent=e.message})};
$("gO").onclick=function(){$("le").textContent="";call("auth","staff",{userId:$("oi").value,password:$("op").value}).then(function(j){if(!j.ok||j.role!=="owner")throw new Error(j.error||"Owner only");tok=j.token;mode="o";TAB="queue";try{sessionStorage.setItem("st",JSON.stringify({t:tok,m:mode}))}catch(e){}return load()}).catch(function(e){$("le").textContent=e.message})};
function dl(name,text){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function out(){tok="";mode="";try{sessionStorage.removeItem("st")}catch(e){}$("app").classList.add("hide");$("login").classList.remove("hide")}
function load(){if(mode==="p")return call("music-api","s_my").then(function(j){D=j;show()});return Promise.all([call("music-api","o_queue"),call("music-api","o_music_stats"),call("music-api","browse",{type:"track",limit:48}),call("music-api","o_support_list"),call("music-api","o_users"),call("music-api","o_home_get")]).then(function(r){Q=r[0];ST=r[1];Q.pool=r[2].items;Q.sup=r[3].items;Q.usr=r[4].users;Q.site=r[5].site;show()})}
function show(){$("login").classList.add("hide");$("app").classList.remove("hide");$("app").innerHTML=mode==="p"?creator():owner();wire()}
function tabs(list){return'<div class="tabs">'+list.map(function(t){return'<button data-tab="'+t[0]+'" class="'+(TAB===t[0]?"on":"")+'">'+t[1]+'</button>'}).join("")+'<button class="alt" id="out">Sign out</button></div>'}

function creator(){var p=D.profile,h='<div class="card"><b>'+esc(p.name)+'</b> '+(p.slug?'· <a href="/music/artist.html?s='+esc(p.slug)+'" target="_blank">your storefront</a>':'<small class="muted">Set a web name below to get a public storefront.</small>')+'<br><small class="muted">'+esc(D.feeNote)+'</small></div>'+tabs([["profile","Profile"],["track","Songs"],["product","Downloads"],["video","Videos"],["sales","Sales"]]);
 if(TAB==="profile"){var l=p.links||{};h+='<div class="card"><label>Web name (your page: /music/artist.html?s=...)</label><input id="f_slug" value="'+esc(p.slug||"")+'" placeholder="e.g. breeze"><label>Bio</label><textarea id="f_bio" rows="4">'+esc(p.bio||"")+'</textarea><label>City</label><input id="f_city" value="'+esc(p.city||"")+'">'+["instagram","youtube","tiktok","soundcloud","spotify","website"].map(function(k){return'<label>'+k+' link (https://)</label><input id="f_'+k+'" value="'+esc(l[k]||"")+'">'}).join("")+'<label>Profile photo</label><input id="f_avf" type="file" accept="image/*"><label>Banner image</label><input id="f_bnf" type="file" accept="image/*"><button id="psv">Save profile</button><div class="err" id="perr"></div></div>'}
 else if(TAB==="sales"){h+='<div class="card">'+(D.sales.length?'<table><tr><th>Date</th><th>Item</th><th>Eligible</th><th>POTENT 1%</th><th>You</th></tr>'+D.sales.map(function(s){return'<tr><td>'+new Date(s.created_at).toLocaleDateString()+'</td><td>'+esc(s.music_products&&s.music_products.title)+(s.status!=="complete"?' <span class="pill">'+esc(s.status)+'</span>':'')+'</td><td>'+usd(s.eligible_cents)+'</td><td>'+usd(s.platform_fee_cents)+'</td><td>'+usd(s.seller_cents)+'</td></tr>'}).join("")+'</table><br><button class="alt" id="csv">Download statement (CSV)</button><small class="muted"> Card fees are Stripe\'s and are separate. Beat sales and your wallet are in Beat Man.</small>':'<span class="muted">No download sales yet.</span>')+'</div>'}
 else{var t=TAB,L=D[LIST[t]];h+='<div class="card"><b>'+TNAME[t]+'</b>'+(L.length?'<table>'+L.map(function(x,i){return'<tr><td>'+esc(x.title)+'<br><span class="pill">'+esc(x.status.replace("_"," "))+'</span>'+(t==="product"&&x.sold_count?' <small>'+x.sold_count+' sold</small>':'')+(t==="track"?' <small>'+(x.plays||0)+' plays</small>':'')+'</td><td><button class="alt" data-ed="'+i+'">Edit</button>'+(x.status==="published"?' <button class="alt" data-ar="'+x.id+'">Unpublish</button>':'')+'</td></tr>'}).join("")+'</table>':'<br><small class="muted">Nothing yet.</small>')+'<br><button id="nw">+ New</button><div id="ebox"></div></div>'}
 return h}
function form(t,x){x=x||{};var n=!x.id;
 var h='<h3>'+(n?"New":"Edit")+'</h3>'+FIELDS[t].map(function(f){var v=x[f.k];var id="e_"+f.k;
  if(f.t==="check")return'<label class="ck"><input type="checkbox" id="'+id+'"'+(v?" checked":"")+'><span>'+f.l+'</span></label>';
  if(f.t==="area")return'<label>'+f.l+'</label><textarea id="'+id+'" rows="3">'+esc(v==null?(f.d||""):v)+'</textarea>';
  if(f.t==="sel")return'<label>'+f.l+'</label><select id="'+id+'">'+f.o.map(function(o){return'<option'+(v===o?" selected":"")+'>'+o+'</option>'}).join("")+'</select>';
  if(f.t==="file")return'<label>'+f.l+(v?' (current file kept unless you pick a new one)':"")+'</label><input type="file" id="'+id+'">';
  if(f.t==="money")return'<label>'+f.l+'</label><input id="'+id+'" inputmode="decimal" value="'+(v?v/100:"")+'">';
  if(f.t==="collab")return'<label>'+f.l+'</label><textarea id="'+id+'" rows="3" placeholder="Jay | Producer | 60&#10;Mia | Vocalist | 40">'+esc((v||[]).map(function(c){return c.name+" | "+(c.role||"")+" | "+c.pct}).join("\n"))+'</textarea>';
  if(f.t==="tags")return'<label>'+f.l+'</label><input id="'+id+'" value="'+esc((v||[]).join(", "))+'">';
  if(f.t==="date")return'<label>'+f.l+'</label><input type="date" id="'+id+'" value="'+esc(v||"")+'">';
  if(f.t==="dt")return'<label>'+f.l+'</label><input type="datetime-local" id="'+id+'" value="'+(v?new Date(new Date(v).getTime()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):"")+'">';
  return'<label>'+f.l+'</label><input id="'+id+'" value="'+esc(v==null?"":v)+'">'}).join("")+
  '<div class="row"><button data-sv="draft">Save draft</button><button data-sv="pending_review">Submit for review</button>'+(D.trusted?'<button data-sv="published">Publish now</button>':'')+'</div><div class="err" id="eer"></div>';
 $("ebox").innerHTML=h;$("ebox").scrollIntoView();
 [].forEach.call($("ebox").querySelectorAll("[data-sv]"),function(b){b.onclick=async function(){try{$("eer").textContent="Saving...";var body={type:t,status:b.dataset.sv};if(x.id)body.id=x.id;
  for(var i=0;i<FIELDS[t].length;i++){var f=FIELDS[t][i],el=$("e_"+f.k);if(f.t==="file"){var fl=el.files[0];if(fl){$("eer").textContent="Uploading "+fl.name+"...";var u=await call("music-api","s_upload_url",{kind:f.fk,name:fl.name});var fd=new FormData();fd.append("cacheControl","3600");fd.append("",fl,fl.name);var r=await fetch(u.uploadUrl,{method:"PUT",body:fd});if(!r.ok)throw new Error("Upload failed for "+fl.name);body[f.to||f.k]=u.ref}}
   else if(f.t==="check")body[f.k]=el.checked;else if(f.t==="money"){var m=String(el.value).replace(/[$,\s]/g,"");if(m!=="")body[f.k]=Math.round(parseFloat(m)*100)}else if(f.t==="collab")body[f.k]=el.value.split("\n").map(function(l){return l.trim()}).filter(Boolean).map(function(l){var p=l.split("|").map(function(x){return x.trim()});return{name:p[0],role:p[1]||"",pct:parseFloat(p[2])}});else if(f.t==="tags")body[f.k]=el.value.split(",").map(function(s){return s.trim()}).filter(Boolean);else if(f.t==="dt")body[f.k]=el.value?new Date(el.value).toISOString():"";else if(f.k==="limited_qty")body[f.k]=el.value;else body[f.k]=el.value}
  await call("music-api","s_item",body);await load()}catch(e){$("eer").textContent=e.message}}})}

function owner(){var s=ST,h='<div class="card"><b>POTENT owner</b><div class="row"><span>Product sales: <b>'+s.productSales+'</b></span><span>Gross '+usd(s.grossCents)+'</span><span>POTENT 1% '+usd(s.platformCents)+'</span><span>Sellers '+usd(s.sellerCents)+'</span><span>Live songs '+s.tracksLive+'</span><span>Plays '+s.plays+'</span><span>Buyers '+s.buyers+'</span></div></div>'+tabs([["queue","Review queue ("+(Q.tracks.length+Q.products.length+Q.videos.length)+")"],["reports","Reports ("+Q.reports.length+")"],["pl","Playlists"],["sup","Support"],["usr","Users"],["site","Site &amp; email"]]);
 if(TAB==="queue"){var any=false;["track","product","video"].forEach(function(t){var L=Q[LIST[t]];if(L.length){any=true;h+='<div class="card"><b>'+TNAME[t]+' waiting</b><table>'+L.map(function(x){return'<tr><td><b>'+esc(x.title)+'</b><br><small class="muted">by '+esc(x.beat_producers&&x.beat_producers.name)+(t==="product"?' · '+usd(x.price_cents)+' · '+esc(x.kind):"")+'</small>'+(x.description?'<br><small>'+esc(x.description)+'</small>':'')+(t==="product"?'<br><small>Rights: '+esc(x.rights_text||"")+'</small><br><small>Samples: '+esc(x.sample_disclosure||"none stated")+'</small>':'')+(t==="track"&&x.audio_url?'<br><audio controls preload="none" src="'+esc(x.audio_url)+'" style="width:100%"></audio>':'')+(t==="video"?'<br><a href="'+esc(x.video_url)+'" target="_blank" rel="noopener">Open video</a>':'')+'</td><td><button data-st="'+t+':'+x.id+':published">Approve</button> <button class="alt" data-st="'+t+':'+x.id+':rejected">Reject</button></td></tr>'}).join("")+'</table></div>'}});
  if(!any)h+='<div class="card muted">Nothing waiting for review.</div>'}
 else if(TAB==="reports"){h+='<div class="card">'+(Q.reports.length?'<table>'+Q.reports.map(function(r){return'<tr><td><b>'+esc(r.kind)+'</b> '+esc(r.item_id)+'<br>'+esc(r.reason)+'<br><small class="muted">'+esc(r.contact||"no contact")+' · '+new Date(r.created_at).toLocaleDateString()+'</small></td><td><button data-tk="'+r.id+':1">Take down</button> <button class="alt" data-tk="'+r.id+':0">Dismiss</button></td></tr>'}).join("")+'</table>':'<span class="muted">No open reports.</span>')+'</div>'}
 else if(TAB==="sup"){h+='<div class="card"><b>Support messages</b>'+((Q.sup||[]).length?'<table>'+Q.sup.map(function(m){return'<tr><td><b>'+esc(m.topic)+'</b> · '+esc(m.name||"")+' &lt;'+esc(m.email)+'&gt;<br>'+esc(m.message)+'<br><small class="muted">'+new Date(m.created_at).toLocaleString()+'</small></td><td><button data-sr="'+m.id+'">Resolve</button></td></tr>'}).join("")+'</table>':'<br><span class="muted">No open messages.</span>')+'</div>'}
 else if(TAB==="usr"){h+='<div class="card"><b>Buyer accounts</b><div class="row"><input id="uq" placeholder="Search email"><button id="ugo">Search</button></div><table>'+(Q.usr||[]).map(function(u){return'<tr><td>'+esc(u.email)+(u.active?'':' <span class="pill">disabled</span>')+'<br><small class="muted">joined '+new Date(u.created_at).toLocaleDateString()+(u.marketing_opt_in?' · emails ok':'')+'</small></td><td><button class="alt" data-rp="'+u.id+'">Reset password</button> <button class="alt" data-ua="'+u.id+':'+(u.active?0:1)+'">'+(u.active?'Disable':'Enable')+'</button></td></tr>'}).join("")+'</table><div id="ures" class="muted"></div></div>'}
 else if(TAB==="site"){var S=Q.site||{};h+='<div class="card"><b>Music home page</b><label>Headline (blank = default)</label><input id="sh" value="'+esc(S.headline||"")+'"><label>Sub line</label><input id="ss" value="'+esc(S.sub||"")+'"><label>Announcement banner</label><input id="sb" value="'+esc(S.banner||"")+'"><button id="ssv">Save</button><div id="sres" class="muted"></div></div><div class="card"><b>Email list</b><br><small class="muted">Buyers who opted in, each with their own unsubscribe link. POTENT does not send email from here yet: use this file with your email provider.</small><br><button id="exp">Download list (CSV)</button></div>'}
 else{h+='<div class="card"><b>Make a POTENT playlist</b><input id="plt" placeholder="Playlist name"><input id="pld" placeholder="Short description"><small class="muted">Tick songs (live songs only):</small>'+Q.pool.map(function(t){return'<label class="ck"><input type="checkbox" data-pt="'+t.id+'"><span>'+esc(t.title)+' — '+esc(t.artist||"")+'</span></label>'}).join("")+'<button id="plg">Publish playlist</button><div class="err" id="pler"></div></div>'}
 return h}

function wire(){var o=$("out");if(o)o.onclick=out;
 [].forEach.call(document.querySelectorAll("[data-tab]"),function(b){b.onclick=function(){TAB=b.dataset.tab;show()}});
 if(mode==="p"){
  if($("psv"))$("psv").onclick=async function(){try{$("perr").textContent="Saving...";var b={slug:$("f_slug").value,bio:$("f_bio").value,city:$("f_city").value,avatar_url:D.profile.avatar_url,banner_url:D.profile.banner_url};["instagram","youtube","tiktok","soundcloud","spotify","website"].forEach(function(k){b[k]=$("f_"+k).value});
   for(var p of [["f_avf","avatar_url"],["f_bnf","banner_url"]]){var fl=$(p[0]).files[0];if(fl){var u=await call("music-api","s_upload_url",{kind:"cover",name:fl.name});var fd=new FormData();fd.append("cacheControl","3600");fd.append("",fl,fl.name);var r=await fetch(u.uploadUrl,{method:"PUT",body:fd});if(!r.ok)throw new Error("Upload failed");b[p[1]]=u.ref}}
   await call("music-api","s_profile",b);await load()}catch(e){$("perr").textContent=e.message}};
  if($("csv"))$("csv").onclick=function(){var q=function(v){v=String(v==null?"":v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};var c="date,item,status,gross,tax,discount,eligible,potent_1pct,you_receive,refunded\n"+D.sales.map(function(s){return[s.created_at.slice(0,10),q(s.music_products&&s.music_products.title),s.status,s.gross_cents/100,(s.tax_cents||0)/100,(s.discount_cents||0)/100,s.eligible_cents/100,s.platform_fee_cents/100,s.seller_cents/100,(s.refunded_cents||0)/100].join(",")}).join("\n");dl("potent-statement.csv",c)};
  if($("nw"))$("nw").onclick=function(){form(TAB,null)};
  [].forEach.call(document.querySelectorAll("[data-ed]"),function(b){b.onclick=function(){form(TAB,D[LIST[TAB]][+b.dataset.ed])}});
  [].forEach.call(document.querySelectorAll("[data-ar]"),function(b){b.onclick=function(){if(confirm("Take this off the public pages? Past buyers keep their files."))call("music-api","s_archive",{type:TAB,id:b.dataset.ar}).then(load).catch(function(e){alert(e.message)})}});
 }else{
  [].forEach.call(document.querySelectorAll("[data-st]"),function(b){b.onclick=function(){var p=b.dataset.st.split(":");call("music-api","o_set_status",{type:p[0],id:p[1],status:p[2]}).then(load).catch(function(e){alert(e.message)})}});
  [].forEach.call(document.querySelectorAll("[data-tk]"),function(b){b.onclick=function(){var p=b.dataset.tk.split(":");if(p[1]==="1"&&!confirm("Take the reported item off the site?"))return;call("music-api","o_takedown",{id:p[0],remove:p[1]==="1"}).then(load).catch(function(e){alert(e.message)})}});
  [].forEach.call(document.querySelectorAll("[data-sr]"),function(b){b.onclick=function(){call("music-api","o_support_resolve",{id:b.dataset.sr}).then(load).catch(function(e){alert(e.message)})}});
  [].forEach.call(document.querySelectorAll("[data-rp]"),function(b){b.onclick=function(){if(!confirm("Set a new temporary password for this buyer? Their old password stops working."))return;call("music-api","o_user_resetpw",{id:b.dataset.rp}).then(function(j){$("ures").innerHTML="Temporary password for <b>"+esc(j.email)+"</b>: <b>"+esc(j.temp)+"</b><br>Give it to them privately and ask them to change it in their library settings."}).catch(function(e){alert(e.message)})}});
  [].forEach.call(document.querySelectorAll("[data-ua]"),function(b){b.onclick=function(){var p=b.dataset.ua.split(":");call("music-api","o_user_active",{id:p[0],active:p[1]==="1"}).then(load).catch(function(e){alert(e.message)})}});
  if($("ugo"))$("ugo").onclick=function(){call("music-api","o_users",{q:$("uq").value}).then(function(j){Q.usr=j.users;show()}).catch(function(e){alert(e.message)})};
  if($("ssv"))$("ssv").onclick=function(){call("music-api","o_home_set",{headline:$("sh").value,sub:$("ss").value,banner:$("sb").value}).then(function(){$("sres").textContent="Saved. The music home page updates within a minute."}).catch(function(e){$("sres").textContent=e.message})};
  if($("exp"))$("exp").onclick=function(){call("music-api","o_email_export").then(function(j){dl("potent-email-list.csv",j.csv);alert(j.count+" opted-in buyers exported.")}).catch(function(e){alert(e.message)})};
  if($("plg"))$("plg").onclick=function(){var ids=[].filter.call(document.querySelectorAll("[data-pt]"),function(c){return c.checked}).map(function(c){return c.dataset.pt});call("music-api","o_playlist_save",{title:$("plt").value,description:$("pld").value,track_ids:ids}).then(function(){$("pler").textContent="Published.";$("plt").value=""}).catch(function(e){$("pler").textContent=e.message})};
 }}
try{var s=JSON.parse(sessionStorage.getItem("st")||"null");if(s&&s.t){tok=s.t;mode=s.m;if(mode==="o")TAB="queue";load().catch(out)}}catch(e){}
</script></body></html>
