$("gP").onclick=function(){$("le").textContent="";call("beat-api","login",{email:$("pe").value,password:$("pp").value}).then(function(j){tok=j.token;mode="p";try{sessionStorage.setItem("st",JSON.stringify({t:tok,m:mode}))}catch(e){}return load()}).catch(function(e){$("le").textContent=e.message})};

function dl(name,text){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

 if(ROLE==="support")return call("music-api","o_support_list").then(function(r){Q={tracks:[],products:[],videos:[],reports:[]};ST={};Q.sup=r.items;show()});

 var h='<h3>'+(n?"New":"Edit")+'</h3>'+FIELDS[t].map(function(f){var v=x[f.k];var id="e_"+f.k;

  if(f.t==="tags")return'<label>'+f.l+'</label><input id="'+id+'" value="'+esc((v||[]).join(", "))+'">';
  if(f.t==="date")return'<label>'+f.l+'</label><input type="date" id="'+id+'" value="'+esc(v||"")+'">';
  if(f.t==="dt")return'<label>'+f.l+'</label><input type="datetime-local" id="'+id+'" value="'+(v?new Date(new Date(v).getTime()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):"")+'">';
  return'<label>'+f.l+'</label><input id="'+id+'" value="'+esc(v==null?"":v)+'">'}).join("")+
  '<div class="row"><button data-sv="draft">Save draft</button><button data-sv="pending_review">Submit for review</button>'+(D.trusted?'<button data-sv="published">Publish now</button>':'')+'</div><div class="err" id="eer"></div>';
 $("ebox").innerHTML=h;$("ebox").scrollIntoView();
 [].forEach.call($("ebox").querySelectorAll("[data-sv]"),function(b){b.onclick=async function(){try{$("eer").textContent="Saving...";var body={type:t,status:b.dataset.sv};if(x.id)body.id=x.id;
