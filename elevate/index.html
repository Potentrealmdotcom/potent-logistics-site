<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="/elevate/manifest.json"><link rel="icon" href="/elevate/icon.svg" type="image/svg+xml">
<title>Əlevate</title>
<style>
:root{--bg:#000;--card:#0e0e0e;--card2:#151515;--line:#262626;--tx:#f4f4f4;--dim:#9a9a9a;--y:#F0E000;--gun:#2a2a2a;--red:#ff6b5e;--ok:#7fd88f}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.mark{width:34px;height:34px;border-radius:10px;background:#000;border:1px solid #3a3600;display:grid;place-items:center;color:var(--y);font-weight:800;font-size:22px;line-height:1}
.logo{font-weight:800;font-size:20px;letter-spacing:.2em;color:var(--tx)}.logo small{display:block;font-size:9px;letter-spacing:.28em;color:var(--y);font-weight:600;margin-top:1px}
.sp{flex:1}.pill{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.on{color:#000;background:var(--y);border-color:var(--y)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--y);color:#000;font-weight:700}
button.alt{background:#1b1b1b;color:var(--tx);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--y);outline-offset:2px}
nav{display:flex;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:transparent;color:var(--dim);border:1px solid transparent;padding:8px 12px;white-space:nowrap}
nav button.on{color:#000;background:var(--y)}
main{flex:1;overflow:auto;padding:16px;max-width:1180px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:12px;letter-spacing:.2em;color:var(--y);text-transform:uppercase;font-weight:700}
.msg{padding:10px 14px;border-radius:16px;margin:8px 0;max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.me{background:#1d1d1d;margin-left:auto;border-bottom-right-radius:4px}.ai{background:#15140a;border:1px solid #3a3600;border-bottom-left-radius:4px}
.did{font-size:12px;color:var(--y);margin:-2px 0 6px 4px}
form.bar{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);max-width:1180px;width:100%;margin:0 auto}
input,textarea,select{font:inherit;color:var(--tx);background:#0b0b0b;border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
input[type=checkbox]{width:auto}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .t{flex:1;word-break:break-word}.row small{color:var(--dim);display:block}.done .t{text-decoration:line-through;color:var(--dim)}
.x{background:transparent;color:var(--dim);padding:6px 10px;border:1px solid var(--line)}
.err{color:var(--red);min-height:22px;font-size:14px}.dim{color:var(--dim)}.hide{display:none!important}
.mic{width:52px;height:52px;border-radius:50%;padding:0;font-size:20px;flex:none}.mic.live{background:var(--red);color:#fff}
.center{margin:12vh auto 0;text-align:center;max-width:380px}.center h1{color:var(--y);letter-spacing:.2em;font-size:34px;margin:.2em 0}
.center .tag{font-size:11px;letter-spacing:.28em;color:var(--y);margin-bottom:8px}
#gbtn{display:flex;justify-content:center;margin:14px 0}
/* ---------- home ---------- */
.home{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:12px}
@media(max-width:860px){.home{grid-template-columns:minmax(0,1fr)}.side{order:-1}}
@media(max-width:560px){#who{display:none}.logo small{display:none}header{gap:8px;padding:10px 12px}main{padding:12px}.ctl{flex-wrap:wrap}.ctl form{flex-basis:100%}}
.home>*{min-width:0}
.mapwrap{position:relative;background:radial-gradient(ellipse at 50% 40%,#10100a 0,#050505 70%);border:1px solid var(--line);border-radius:16px;overflow:hidden}
#map{display:block;width:100%;height:auto;aspect-ratio:2.05/1;touch-action:none;cursor:grab;user-select:none}
#map:active{cursor:grabbing}
#map path.c{fill:#1c1c14;stroke:#4a4510;stroke-width:.6;vector-effect:non-scaling-stroke}
#map path.c:hover{fill:#26261a}#map path.c.sel{fill:#3a3600;stroke:var(--y)}
#map .grat{fill:none;stroke:#1b1b1b;stroke-width:.5;vector-effect:non-scaling-stroke}
#map .out{fill:none;stroke:#33300a;stroke-width:1;vector-effect:non-scaling-stroke}
#map .pin{fill:var(--y);stroke:#000;stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer}
#map .cross{stroke:#fff;stroke-width:1.2;vector-effect:non-scaling-stroke}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;padding:0;font-size:20px;background:#111c;color:var(--tx);border:1px solid var(--line)}
.mapstat{position:absolute;left:10px;bottom:8px;right:60px;font-size:12px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.mapstat button{pointer-events:auto;padding:4px 10px;font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--y);margin-right:4px}.dot.g{background:#555}
.layers{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:14px}.layers label{display:flex;gap:6px;align-items:center}
.layers .plan{color:var(--dim)}
.side{display:flex;flex-direction:column}
/* ---------- orb ---------- */
.orbbox{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 0 4px}
.orb{--amp:0;position:relative;width:150px;height:150px;border-radius:50%;display:grid;place-items:center}
.orb i{position:absolute;inset:0;border-radius:50%;border:2px solid #3a3600}
.orb .r2{inset:14px;border-color:#2a2700}
.orb .core{inset:34px;background:radial-gradient(circle at 50% 40%,#fff6 0,var(--y) 28%,#6b6400 75%,#1a1800 100%);border:0;transform:scale(calc(1 + var(--amp)*.35));box-shadow:0 0 calc(18px + var(--amp)*60px) #F0E00055;transition:transform .08s linear}
.orb b{position:relative;font-size:40px;color:#000;font-weight:800;line-height:1}
.orb[data-state=listening] .r1{animation:pulse 3s ease-in-out infinite}
.orb[data-state=thinking] .r1{border-color:var(--y) transparent transparent transparent;animation:spin 1.6s linear infinite}
.orb[data-state=executing] .r1{border-color:var(--y) var(--y) transparent transparent;animation:spin 1.1s linear infinite}
.orb[data-state=executing] .r2{border-style:dashed}
.orb[data-state=speaking] .r1{border-color:var(--y)}
.orb[data-state=approval] .r1{border-color:#fff;animation:pulse 1.6s ease-in-out infinite}
.orb[data-state=done] .r1{border-color:var(--ok)}
.orb[data-state=error] .r1,.orb[data-state=error] .r2{border-color:var(--red)}
.orb[data-state=blocked]{filter:grayscale(1) brightness(.6)}.orb[data-state=blocked] .r1{border-style:dashed}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.07);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.orb *{animation:none!important;transition:none!important}.orb .core{transform:none!important}}
body.calm .orb *{animation:none!important;transition:none!important}body.calm .orb .core{transform:none!important}
.orbst{font-weight:700;letter-spacing:.14em;font-size:12px;color:var(--y);text-transform:uppercase}.orbnote{font-size:13px;color:var(--dim);min-height:20px}
.ctl{display:flex;gap:8px;align-items:center;width:100%}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;color:var(--tx);font-weight:600;font-size:14px}
.cat small{display:block;font-weight:400;color:var(--dim);font-size:12px}.cat.live small{color:var(--y)}.cat:disabled{opacity:.55}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}

<script>

/* ---------- home: map + orb + today ---------- */

  var q=el("form");q.style.cssText="display:flex;gap:6px;flex:1";var qi=el("input");qi.placeholder="Type to Əlevate…";qi.maxLength=2000;qi.setAttribute("aria-label","Type to Əlevate");var qb=el("button",null,"Send");q.appendChild(qi);q.appendChild(qb);
