<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIFE OS — Your personal AI operator</title><meta name="theme-color" content="#0b1220">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Sora:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--card:#111a2e;--line:#22314f;--acc:#2dd4bf;--acc2:#f59e0b;--txt:#eef2ff;--dim:#8da0c4;--bad:#fb7185}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Sora,Inter,sans-serif;margin:0}#app{max-width:640px;margin:0 auto;padding:16px 16px 96px}
.btn{background:var(--acc);color:#04201c;border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}.btn.sm{padding:7px 11px;font-size:13px}
input,textarea,select{width:100%;background:#0a1020;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px;margin:5px 0 10px;font:inherit}input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label{font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.dim{color:var(--dim)}.big{font:800 30px Sora}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.sp{margin-top:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0b1220ee;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}nav div{display:flex;max-width:640px;width:100%}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:11px 2px;font-size:11px;font-weight:700;cursor:pointer}nav button.on{color:var(--acc)}
.ai{white-space:pre-wrap;background:#0a1020;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}.warn{color:var(--acc2)}.bad{color:var(--bad)}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.x{background:none;border:0;color:var(--dim);cursor:pointer}
</style></head><body><div id="app"></div><nav><div id="nv"></div></nav>
<script>
var T=[["home","Life OS"],["save","Save Me"],["income","Income"],["family","Family"],["biz","Business"]],tab=localStorage.getItem("lifeos_tab")||"home";
var DB;try{DB=JSON.parse(localStorage.getItem("lifeos")||"{}")}catch(e){DB={}}
DB.subs=DB.subs||[];DB.gigs=DB.gigs||[];DB.groc=DB.groc||[];DB.events=DB.events||[];DB.leads=DB.leads||[];DB.tasks=DB.tasks||[];
function save(){try{localStorage.setItem("lifeos",JSON.stringify(DB))}catch(e){}}
function $(s){return document.querySelector(s)}function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
async function ai(mode,text,ctx,out){var el=$(out);el.innerHTML='<div class="ai dim">Thinking...</div>';try{var r=await fetch("/.netlify/functions/life-ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:mode,text:text,context:ctx})});var d=await r.json();el.innerHTML='<div class="ai">'+esc(d.ok?d.text:d.error)+'</div>'+(d.ok?'<button class="btn ghost sm sp" onclick="navigator.clipboard&&navigator.clipboard.writeText(this.previousSibling.textContent)">Copy</button>':'')}catch(e){el.innerHTML='<div class="ai bad">No connection.</div>'}}
function monthly(s){var a=+s.amount||0;return s.cycle=="yearly"?a/12:s.cycle=="weekly"?a*52/12:a}
function days(d){return d?Math.ceil((new Date(d+"T00:00")-new Date().setHours(0,0,0,0))/864e5):null}
function list(arr,key,fmt){return arr.length?arr.map(function(x,i){return '<div class="item"><div>'+fmt(x)+'</div><button class="x" aria-label="Remove" data-rm="'+key+'" data-i="'+i+'">✕</button></div>'}).join(""):'<div class="dim">Nothing yet.</div>'}
function wire(){document.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){DB[b.dataset.rm].splice(+b.dataset.i,1);save();render()}})}
var V={
home:function(){var due=DB.subs.filter(function(s){var d=days(s.renew);return d!=null&&d>=0&&d<=7}).length,open=DB.tasks.filter(function(t){return !t.done}).length;
 return '<h1>LIFE OS</h1><p class="dim">Tell it what you need. It makes the plan and drafts the busywork. You stay in control.</p><div class="card"><label for="q">What do you need handled?</label><textarea id="q" rows="3" placeholder="Help me lower my bills. Organize my week. Handle a refund..."></textarea><button class="btn" id="go">Make a plan</button><div id="o"></div></div>'+
 '<div class="row"><div class="card"><div class="dim">Subscriptions / month</div><div class="big">$'+DB.subs.reduce(function(a,s){return a+monthly(s)},0).toFixed(0)+'</div></div><div class="card"><div class="dim">Renewing in 7 days</div><div class="big '+(due?"warn":"")+'">'+due+'</div></div></div>'+
 '<div class="card"><h3>My to-dos</h3><div class="row sp"><input id="tk" placeholder="Add a to-do"><button class="btn sm" id="ta" style="flex:0">Add</button></div>'+(DB.tasks.length?DB.tasks.map(function(t,i){return '<div class="item"><label style="text-transform:none;font-size:15px;color:var(--txt)"><input type="checkbox" style="width:auto;margin:0 8px 0 0" data-t="'+i+'" '+(t.done?"checked":"")+'>'+(t.done?'<s class="dim">'+esc(t.t)+'</s>':esc(t.t))+'</label><button class="x" data-rm="tasks" data-i="'+i+'" aria-label="Remove">✕</button></div>'}).join(""):'<div class="dim">Nothing yet.</div>')+'</div>'},
save:function(){var tot=DB.subs.reduce(function(a,s){return a+monthly(s)},0);
 return '<h1>Save Me</h1><p class="dim">Track every subscription and bill. Get warned before renewals. Get scripts to cut costs.</p><div class="card"><div class="dim">Total per month</div><div class="big">$'+tot.toFixed(2)+'</div><div class="dim">$'+(tot*12).toFixed(0)+' a year</div></div>'+
 '<div class="card"><h3>Add a bill or subscription</h3><input id="sn" placeholder="Name (Netflix, phone, insurance...)"><div class="row"><input id="sa" type="number" step="0.01" placeholder="Amount $"><select id="sc"><option value="monthly">monthly</option><option value="yearly">yearly</option><option value="weekly">weekly</option></select></div><label for="sr">Next renewal / due</label><input id="sr" type="date"><button class="btn" id="sadd">Add</button></div>'+
 '<div class="card"><h3>My list</h3>'+list(DB.subs,"subs",function(s){var d=days(s.renew);return '<b>'+esc(s.name)+'</b> $'+(+s.amount).toFixed(2)+'/'+s.cycle.replace("ly","")+(d!=null?'<div class="'+(d<=7&&d>=0?"warn":"dim")+'" style="font-size:12px">'+(d<0?"renewal passed":d==0?"renews today":"renews in "+d+" days")+'</div>':'')})+'</div>'+
 '<div class="card"><h3>Lower a bill / cancel / get a refund</h3><label for="nq">Describe it</label><textarea id="nq" rows="3" placeholder="Comcast internet $120/month, I want it cut to about $80..."></textarea><button class="btn" id="ng">Write my script &amp; letter</button><div id="o"></div></div>'},
income:function(){return '<h1>Income OS</h1><p class="dim">Find ways to earn, draft the messages, track who you contacted.</p><div class="card"><label for="sk">Skills, time, place</label><textarea id="sk" rows="3" placeholder="CDL driver, 15 hrs/week free, near Atlanta, have a pickup truck..."></textarea><button class="btn" id="ig">Find me income ideas</button><div id="o"></div></div>'+
 '<div class="card"><h3>Draft an application or message</h3><textarea id="ap" rows="3" placeholder="Job/gig, who it\'s to, my background in 2 lines"></textarea><button class="btn" id="ag">Write it</button><div id="o2"></div></div>'+
 '<div class="card"><h3>Outreach tracker</h3><div class="row"><input id="gn" placeholder="Who / where"><select id="gs"><option>contacted</option><option>replied</option><option>interview</option><option>won</option><option>no</option></select></div><button class="btn sm" id="gadd">Add</button><div class="sp">'+list(DB.gigs,"gigs",function(g){return '<b>'+esc(g.name)+'</b> <span class="dim">'+esc(g.st)+' · '+esc(g.at)+'</span>'})+'</div></div>'},
family:function(){return '<h1>Family OS</h1><p class="dim">One place for the household: calendar, groceries, meals.</p><div class="card"><h3>Calendar</h3><div class="row"><input id="en" placeholder="Event (dentist, practice...)"><input id="ed" type="date"></div><button class="btn sm" id="eadd">Add</button><div class="sp">'+list(DB.events.slice().sort(function(a,b){return a.d>b.d?1:-1}),"events",function(e){return '<b>'+esc(e.n)+'</b> <span class="dim">'+esc(e.d)+'</span>'})+'</div></div>'+
 '<div class="card"><h3>Grocery list</h3><div class="row"><input id="gi" placeholder="Add an item"><button class="btn sm" id="gadd2" style="flex:0">Add</button></div>'+list(DB.groc,"groc",function(g){return esc(g)})+'</div>'+
 '<div class="card"><h3>Meal plan</h3><label for="mp">Household, budget, allergies, likes</label><textarea id="mp" rows="3" placeholder="4 people, $120/week, one child allergic to peanuts, we like chicken and rice..."></textarea><button class="btn" id="mg">Plan 5 dinners + grocery list</button><div id="o"></div></div>'},
biz:function(){return '<h1>Business in a Box</h1><p class="dim">Leads, quotes, follow-ups. Your digital office helper.</p><div class="card"><h3>Leads</h3><div class="row"><input id="ln" placeholder="Customer / company"><input id="lv" type="number" placeholder="Job value $"></div><button class="btn sm" id="ladd">Add lead</button><div class="sp">'+list(DB.leads,"leads",function(l){return '<b>'+esc(l.n)+'</b> <span class="dim">$'+(+l.v||0)+' · '+esc(l.at)+'</span>'})+'</div><div class="dim sp">Open pipeline: <b>$'+DB.leads.reduce(function(a,l){return a+(+l.v||0)},0)+'</b></div></div>'+
 '<div class="card"><h3>Draft a quote, invoice text or follow-up</h3><select id="bt"><option value="quote">Quote</option><option value="invoice">Invoice text</option><option value="followup">Lead follow-up</option><option value="reply">Customer reply</option></select><textarea id="bq" rows="4" placeholder="What the job is, price lines, customer name, tone..."></textarea><button class="btn" id="bg">Write it</button><div id="o"></div></div>'}};
var H={
home:function(){$("#go").onclick=function(){var q=$("#q").value.trim();q&&ai("operator",q,"Subscriptions: "+DB.subs.map(function(s){return s.name+" $"+s.amount+"/"+s.cycle}).join("; ")+". To-dos: "+DB.tasks.filter(function(t){return !t.done}).map(function(t){return t.t}).join("; "),"#o")};
 $("#ta").onclick=function(){var v=$("#tk").value.trim();if(v){DB.tasks.push({t:v});save();render()}};document.querySelectorAll("[data-t]").forEach(function(c){c.onchange=function(){DB.tasks[+c.dataset.t].done=c.checked;save();render()}})},
save:function(){$("#sadd").onclick=function(){var n=$("#sn").value.trim();if(!n||!(+$("#sa").value>0))return;DB.subs.push({name:n,amount:$("#sa").value,cycle:$("#sc").value,renew:$("#sr").value});save();render()};$("#ng").onclick=function(){var q=$("#nq").value.trim();q&&ai("negotiate",q,"","#o")}},
income:function(){$("#ig").onclick=function(){var q=$("#sk").value.trim();q&&ai("income",q,"","#o")};$("#ag").onclick=function(){var q=$("#ap").value.trim();q&&ai("apply",q,"","#o2")};$("#gadd").onclick=function(){var n=$("#gn").value.trim();if(n){DB.gigs.push({name:n,st:$("#gs").value,at:new Date().toLocaleDateString()});save();render()}}},
family:function(){$("#eadd").onclick=function(){var n=$("#en").value.trim();if(n&&$("#ed").value){DB.events.push({n:n,d:$("#ed").value});save();render()}};$("#gadd2").onclick=function(){var v=$("#gi").value.trim();if(v){DB.groc.push(v);save();render()}};$("#mg").onclick=function(){var q=$("#mp").value.trim();q&&ai("meals",q,"","#o")}},
biz:function(){$("#ladd").onclick=function(){var n=$("#ln").value.trim();if(n){DB.leads.push({n:n,v:$("#lv").value,at:new Date().toLocaleDateString()});save();render()}};$("#bg").onclick=function(){var q=$("#bq").value.trim();q&&ai("quote",q,"Type: "+$("#bt").value,"#o")}}};
function render(){$("#nv").innerHTML=T.map(function(t){return '<button class="'+(tab==t[0]?"on":"")+'" data-n="'+t[0]+'">'+t[1]+'</button>'}).join("");document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){tab=b.dataset.n;try{localStorage.setItem("lifeos_tab",tab)}catch(e){}render()}});
 $("#app").innerHTML=V[tab]()+'<p class="dim" style="font-size:12px">Your lists stay on this device. '+'<a href="#" id="ex" style="color:var(--acc)">Download a backup</a>. Drafts come from a free AI: check them before you send. Not legal, tax or financial advice.</p>';H[tab]();wire();
 $("#ex").onclick=function(e){e.preventDefault();var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}));a.download="life-os-backup.json";a.click()}}
render();
</script></body></html>
