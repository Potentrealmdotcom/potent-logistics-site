<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:,">
<title>Beat Man — Wallet &amp; Store Admin</title>
<style>
:root{color-scheme:dark light;--bg:#0a0a0a;--panel:#141412;--panel2:#1c1b17;--ink:#f7f4ec;--muted:#b8b3a8;--gold:#d4af37;--line:rgba(255,255,255,.16);--ok:#2ecc71;--bad:#e74c3c}
@media (prefers-color-scheme:light){:root{--bg:#f6f3ea;--panel:#fff;--panel2:#f1ede0;--ink:#16140f;--muted:#6d675a;--line:rgba(0,0,0,.14)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:760px;margin-inline:auto}
h1{font-size:26px;margin:8px 0 2px;color:var(--gold)}h2{font-size:18px;margin:0 0 10px}small,.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;margin:4px 0 8px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;background:var(--gold);color:#120d00;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}button.sm{padding:7px 12px;font-size:13px}button:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.big{font-size:34px;font-weight:800}.pill{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.pos{color:var(--ok)}.neg{color:var(--bad)}.err{color:var(--bad);min-height:20px}.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{flex:1}
.hide{display:none}textarea{font:inherit;padding:10px}input[type=checkbox]{width:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.grid .k{font-size:12px;color:var(--muted)}.grid .v{font-size:22px;font-weight:800}.ck{display:flex;gap:8px;align-items:flex-start;margin:6px 0}.ck input{margin-top:4px}
</style>
</head>
<body>
<h1>🎵 Beat Man</h1>
<div class="muted">Your sales, your split, your wallet — updated the moment a beat sells.</div>

<div id="login" class="card">
  <div class="tabs"><button id="tabP">Producer login</button><button id="tabO" class="alt">POTENT owner</button></div>
  <div id="fP">
    <label>User ID or email<input id="pe" type="text" autocomplete="username" autocapitalize="none"></label>
    <label>Password<input id="pp" type="password" autocomplete="current-password"></label>
    <button id="goP">Sign in</button>
  </div>
  <div id="fO" class="hide">
    <label>Staff ID<input id="oid" value="potent" autocomplete="username"></label>
    <label>Password<input id="op" type="password" autocomplete="current-password"></label>
    <button id="goO">Owner sign in</button>
  </div>
  <div class="err" id="lerr"></div>
</div>

<div id="app" class="hide"></div>

<script>
var API="/.netlify/functions/beat-api",tok="",mode="",D=null,S=null,ST=null,AP=null,AU=null;
var RIGHTS="Exclusive license to use the instrumental in new recordings and release them commercially, as set out in the Exclusive Purchase Agreement. Includes the files listed under 'What you get'. Ownership of the underlying composition and master of the instrumental is not transferred unless the agreement says so.";
var STAT=["draft","pending_review","approved","published","unavailable","rejected"];
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function usd(c){var n=(c||0)/100;return(n<0?"-":"")+"$"+Math.abs(n).toFixed(2)}
function call(a,b){return fetch(API,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify(Object.assign({action:a},b||{}))}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Something went wrong");return j})})}
function dt(s){return s?new Date(s).toLocaleDateString():""}
var METHOD_NAMES={paypal:"PayPal",airtm:"Airtm",zinli:"Zinli",usdt:"USDT (crypto dollars)",binance:"Binance Pay",westernunion:"Western Union / MoneyGram",wise:"Wise",zelle:"Zelle (US only)",other:"Other"};
function isStore(){return mode==="o"||(D&&D.producer&&D.producer.store_admin)}
function isSeller(){return mode==="p"&&D.producer.kind==="seller"}
function act(n){return isSeller()?n:(mode==="o"?"o_":"s_")+n}
function store(){return mode==="o"?{producers:D.producers,beats:D.beats.map(function(x){return Object.assign({},x,{producer_name:x.beat_producers&&x.beat_producers.name})})}:isSeller()?{producers:[],beats:D.beats}:S}

$("tabP").onclick=function(){$("fP").classList.remove("hide");$("fO").classList.add("hide");$("tabP").classList.remove("alt");$("tabO").classList.add("alt")};
$("tabO").onclick=function(){$("fO").classList.remove("hide");$("fP").classList.add("hide");$("tabO").classList.remove("alt");$("tabP").classList.add("alt")};
function loadAll(){
  if(mode==="o")return Promise.all([call("o_list"),call("o_stats"),call("o_apps")]).then(function(r){D=r[0];ST=r[1];AP=r[2].apps;show()});
  return call("me").then(function(j){D=j;return j.producer.store_admin?call("s_list").then(function(s){S=s}):null}).then(show)}
$("goP").onclick=function(){$("lerr").textContent="";call("login",{email:$("pe").value,password:$("pp").value}).then(function(j){tok=j.token;mode="p";try{sessionStorage.setItem("bm",JSON.stringify({t:tok,m:"p"}))}catch(e){}return loadAll()}).catch(function(e){$("lerr").textContent=e.message})};
$("goO").onclick=function(){$("lerr").textContent="";fetch("/.netlify/functions/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"staff",userId:$("oid").value,password:$("op").value})}).then(function(r){return r.json()}).then(function(j){if(!j.ok||j.role!=="owner")throw new Error(j.error||"Owner only");tok=j.token;mode="o";try{sessionStorage.setItem("bm",JSON.stringify({t:tok,m:"o"}))}catch(e){}return loadAll()}).catch(function(e){$("lerr").textContent=e.message})};
function out(){tok="";mode="";D=S=ST=AP=AU=null;try{sessionStorage.removeItem("bm")}catch(e){}$("app").classList.add("hide");$("login").classList.remove("hide");$("pp").value="";$("op").value=""}
function refresh(){return loadAll().catch(function(e){alert(e.message);if(/Session|Sign in|owner only/i.test(e.message))out()})}
function show(){$("login").classList.add("hide");$("app").classList.remove("hide");$("app").innerHTML=(mode==="p"?producerHTML():"")+(mode==="o"?ownerTop():"")+(isStore()?storeHTML():"")+(isSeller()?sellerHTML():"")+(mode==="o"?ownerBottom():"");wire()}

function producerHTML(){
  var p=D.producer,b=D.balance,h='<div class="row" style="align-items:center;justify-content:space-between"><div><b>'+esc(p.name)+'</b>'+(p.store_admin?' <span class="pill">store admin</span>':'')+(p.kind==="seller"?' <span class="pill">seller</span>':'')+'<br><small>'+esc(p.email)+'</small></div><button class="alt sm" id="out">Sign out</button></div>';
  h+='<div class="card"><div class="muted">Available to withdraw</div><div class="big pos">'+usd(b.available)+'</div><small>Pending (clears after '+p.hold_days+' days): '+usd(b.pending)+'</small>';
  h+='<div class="row" style="margin-top:10px"><button id="cash"'+(b.available>=D.minPayoutCents?'':' disabled')+'>Cash out all</button></div><small>Cashing out needs the payout code from POTENT. Minimum payout '+usd(D.minPayoutCents)+'. Your split: lease '+p.splits.lease+'%, exclusive '+p.splits.exclusive+'% of each sale'+(p.deduct_fees?' (after card fees)':'')+'.</small></div>';
  h+='<div class="card"><h2>How you get paid</h2><select id="pm"><option value="">Choose a method…</option>'+D.methods.map(function(m){return'<option value="'+m+'"'+(p.payout_method===m?' selected':'')+'>'+esc(METHOD_NAMES[m]||m)+'</option>'}).join("")+'</select><input id="ph" placeholder="Your account email, username or wallet label" value="'+esc(p.payout_handle||"")+'"><small>Never type a full card or bank number here.</small><br><button class="alt" id="savepm">Save payout method</button></div>';
  h+='<div class="card"><h2>Sales</h2>'+(D.sales.length?'<table><tr><th>Date</th><th>Beat</th><th>Sold</th><th>You earn</th></tr>'+D.sales.map(function(s){return'<tr><td>'+dt(s.created_at)+'</td><td>'+esc(s.title)+'<br><small>'+esc(s.sale_type)+(s.status==="refunded"?" · refunded":"")+'</small></td><td>'+usd(s.gross_cents)+'</td><td class="pos">'+usd(s.producer_cents)+'</td></tr>'}).join("")+'</table>':'<small>No sales yet. They appear here the second a buyer pays.</small>')+'</div>';
  h+='<div class="card"><h2>Wallet history</h2>'+(D.txns.length?'<table>'+D.txns.map(function(t){return'<tr><td>'+dt(t.created_at)+'</td><td>'+esc(t.note||t.type)+'</td><td class="'+(t.amount_cents<0?'neg':'pos')+'">'+usd(t.amount_cents)+'</td></tr>'}).join("")+'</table>':'<small>Nothing yet.</small>')+'</div>';
  h+='<div class="card"><h2>Payouts</h2>'+(D.payouts.length?'<table>'+D.payouts.map(function(t){return'<tr><td>'+dt(t.requested_at)+'</td><td>'+usd(t.amount_cents)+'<br><small>'+esc(METHOD_NAMES[t.method]||t.method)+'</small></td><td><span class="pill">'+esc(t.status)+'</span>'+(t.reference?'<br><small>Ref '+esc(t.reference)+'</small>':'')+'</td></tr>'}).join("")+'</table>':'<small>No payouts yet.</small>')+'</div>';
  return h}

function ownerTop(){
  var s=ST,m=s.revenueModel||{},n=function(k){return s.byStatus[k]||0};
  var h='<div class="row" style="align-items:center;justify-content:space-between"><b>POTENT owner</b><button class="alt sm" id="out">Sign out</button></div>';
  h+='<div class="card"><h2>Marketplace totals</h2><div class="grid">'+[["Published",n("published")],["Pending review",n("pending_review")],["Sold exclusives",s.soldExclusives],["Gross sales",usd(s.grossCents)],["Net eligible (after tax & est. fees)",usd(s.netEligibleCents)],["Platform earnings",usd(s.platformCents)],["Producer earnings",usd(s.producerCents)],["Artist earnings","Not defined yet"],["Refunds",usd(s.refundsCents)],["Pending payouts",usd(s.pendingPayoutsCents)],["Preview plays",s.plays]].map(function(x){return'<div><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>'}).join("")+'</div><small>Card fees are estimated (2.9% + 30¢) until the exact fee is pulled from Stripe. Platform earnings = net eligible minus producer share.</small></div>';
  var pend=D.payouts.filter(function(x){return x.status==="pending"});
  h+='<div class="card"><h2>Pending payouts</h2>'+(pend.length?'<table>'+pend.map(function(x){return'<tr><td>'+esc(x.beat_producers&&x.beat_producers.name)+'<br><small>'+dt(x.requested_at)+'</small></td><td><b>'+usd(x.amount_cents)+'</b><br><small>'+esc(METHOD_NAMES[x.method]||x.method)+': '+esc(x.handle)+'</small></td><td><button class="sm" data-paid="'+x.id+'">Mark paid</button> <button class="alt sm" data-cx="'+x.id+'">Cancel</button></td></tr>'}).join("")+'</table>':'<small>None waiting.</small>')+'</div>';
  var pa=(AP||[]).filter(function(a){return a.status==="pending"});
  h+='<div class="card"><h2>Seller applications ('+pa.length+' waiting)</h2>'+(pa.length?'<table>'+pa.map(function(a){return'<tr><td><b>'+esc(a.producer_name)+'</b> ('+esc(a.legal_name)+')<br><small>'+esc(a.email)+' · '+esc(a.country||"")+'<br>'+esc(a.portfolio||"")+'<br>Samples: '+esc(a.sample_info||"none stated")+'</small></td><td><button class="sm" data-ap="'+a.id+'">Approve</button> <button class="alt sm" data-rj="'+a.id+'">Reject</button></td></tr>'}).join("")+'</table>':'<small>None waiting. Sellers apply at /beats/apply.html</small>')+'<div id="apout"></div></div>';
  h+='<div class="card"><h2>Producers</h2>'+(D.producers.length?'<table><tr><th>Name</th><th>Wallet</th><th></th></tr>'+D.producers.map(function(p){return'<tr><td>'+esc(p.name)+(p.kind==="seller"?' <span class="pill">seller</span>':'')+(p.store_admin?' <span class="pill">store admin</span>':'')+(p.verified?' <span class="pill">verified</span>':'')+'<br><small>'+esc(p.email)+' · '+esc(p.country||"")+'<br>lease '+p.splits.lease+'% · excl '+p.splits.exclusive+'% · hold '+p.hold_days+'d'+(p.active?'':' · OFF')+'</small></td><td>'+usd(p.balance.available)+'<br><small>+'+usd(p.balance.pending)+' pending</small></td><td><button class="alt sm" data-sp="'+p.id+'">Splits</button> <button class="alt sm" data-adj="'+p.id+'">Bonus/adjust</button> <button class="alt sm" data-pw="'+p.id+'">Reset pw</button> <button class="alt sm" data-sa="'+p.id+'">Store admin: '+(p.store_admin?'turn off':'turn on')+'</button> <button class="alt sm" data-vf="'+p.id+'">'+(p.verified?'Unverify':'Verify')+'</button></td></tr>'}).join("")+'</table>':'<small>No producers yet.</small>')+'</div>';
  h+='<div class="card"><h2>Add a producer</h2><input id="cn" placeholder="Name"><input id="ce" type="email" placeholder="Email (their login)"><input id="cc" placeholder="Country"><input id="cpw" type="text" placeholder="Password for them (10+ characters), or leave blank to auto-make one"><div class="row"><input id="cl" inputmode="numeric" placeholder="Lease % to producer" value="50"><input id="cx" inputmode="numeric" placeholder="Exclusive % to producer" value="50"></div><button id="mk">Create account</button><div class="err" id="cerr"></div><div id="cout"></div></div>';
  return h}

function bulkHTML(){var st=store();return'<div class="card"><h2>Add beats to the public store</h2><label class="muted">Producer who earns on these</label><select id="bkp">'+st.producers.filter(function(p){return p.kind!=="seller"}).map(function(p){return'<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join("")+'</select><small>Pick many files at once. Titles, BPM and key are read from the file names. Buyers hear a 30-second preview clip made on your device and get the full file only after paying.</small><div class="row"><input id="bke" inputmode="decimal" value="500" placeholder="Exclusive price $"><input id="bkl" inputmode="decimal" placeholder="Lease price $ (blank = exclusive only)"></div><div class="row"><input id="bkgn" placeholder="Genre (trap, r&b...)"><input id="bkmd" placeholder="Mood (dark, chill...)"></div><input id="bktg" value="trap, type beat" placeholder="Tags for all these beats, separated by commas"><textarea id="bkrp" rows="3">'+esc(RIGHTS)+'</textarea><label class="ck"><input type="checkbox" id="bkrc"><span>I confirm POTENT owns, or is legally authorized to sell, exclusive rights to these beats.</span></label><label class="ck"><input type="checkbox" id="bkpub" checked><span>Publish right away (uncheck to save as drafts)</span></label><input id="bkf" type="file" multiple accept=".mp3,.wav,.m4a,.flac"><div id="bklist"></div><button id="bkgo" style="display:none">Upload beats to the store</button><div class="err" id="bkerr"></div></div>'}
function storeHTML(){var st=store();
  var h='<div class="card"><h2>Store admin</h2><small>You run the public store: upload, edit and publish beats. Money, payouts and other accounts are not part of this.</small></div>'+bulkHTML();
  h+='<div class="card"><h2>Store beats (live on /beats/)</h2>'+(st.beats.length?'<table><tr><th>Beat</th><th>Prices</th><th></th></tr>'+st.beats.map(function(x,i){return'<tr><td>'+esc(x.title)+'<br><small>'+esc(x.producer_name||"")+(x.bpm?' · '+x.bpm+' BPM':'')+(x.musical_key?' · '+esc(x.musical_key):'')+'</small><br><span class="pill">'+esc(x.status)+'</span>'+(x.rights_confirmed?'':' <span class="pill">rights not confirmed</span>')+(x.active?'':' <span class="pill">hidden</span>')+' <small>'+(x.play_count||0)+' plays</small></td><td>'+(x.lease_cents?'L '+usd(x.lease_cents):'')+'<br>'+(x.exclusive_cents?'E '+usd(x.exclusive_cents):'')+'</td><td><button class="alt sm" data-eb="'+i+'">Edit</button>'+(mode==="o"&&x.exclusive_sold&&x.status==="unavailable"?' <button class="alt sm" data-rl="'+x.id+'">Re-list</button>':'')+'</td></tr>'}).join("")+'</table>':'<small>No beats yet.</small>')+'<div id="ebox"></div></div>';
  return h}
function sellerHTML(){
  var h='<div class="card"><h2>My beats</h2><small>Everything you submit is reviewed by POTENT before it can be bought.</small>'+(D.beats.length?'<table>'+D.beats.map(function(x,i){return'<tr><td>'+esc(x.title)+'<br><span class="pill">'+esc(x.status)+'</span>'+(x.exclusive_sold?' <span class="pill">sold</span>':'')+'</td><td>'+(x.exclusive_cents?usd(x.exclusive_cents):"")+'</td><td><button class="alt sm" data-eb="'+i+'">Edit</button></td></tr>'}).join("")+'</table>':'<br><small>No beats yet.</small>')+'<br><button id="newb">+ New beat</button><div id="ebox"></div></div>';
  return h}
function ownerBottom(){
  var m=(ST&&ST.revenueModel)||{};
  var h='<div class="card"><h2>Payout code</h2><small>'+(ST.payoutCodeSet?'A payout code is set. Producers can\'t cash out without it.':'<b>No payout code set, so nobody can cash out yet.</b>')+' Only you should know it. Give it to a producer only when you want them to be able to withdraw.</small>'+(ST.payoutCodeSet?'<input id="pco" type="password" placeholder="Current code" autocomplete="off">':'')+'<input id="pcn" type="password" placeholder="New payout code (6+ characters)" autocomplete="off"><button id="pcs">Save payout code</button></div>';
  h+='<div class="card"><h2>Revenue model (artist / producer / platform %)</h2><small>The 91 / 8 / 1 idea has not been tied to a specific revenue stream yet. Nothing is shown to buyers or paid out from these numbers until you describe the stream and tick Confirmed. Producer wallets are still paid by each producer\'s own split.</small><textarea id="rms" rows="3" placeholder="Which exact revenue do these percentages apply to, and who pays whom?">'+esc(m.stream||"")+'</textarea><div class="row"><input id="rma" inputmode="decimal" placeholder="Artist %" value="'+(m.artist_pct==null?91:m.artist_pct)+'"><input id="rmp" inputmode="decimal" placeholder="Producer %" value="'+(m.producer_pct==null?8:m.producer_pct)+'"><input id="rml" inputmode="decimal" placeholder="Platform %" value="'+(m.platform_pct==null?1:m.platform_pct)+'"></div><input id="rmt" placeholder="Short sentence shown on the store when confirmed" value="'+esc(m.public_text||"")+'"><label class="ck"><input type="checkbox" id="rmc"'+(m.confirmed?' checked':'')+'><span>Confirmed</span></label><button id="rmv">Save revenue model</button><div class="err" id="rme"></div></div>';
  h+='<div class="card"><h2>Recent sales</h2>'+(D.sales.length?'<table>'+D.sales.map(function(s){return'<tr><td>'+dt(s.created_at)+'</td><td>'+esc(s.title)+' <small>'+esc(s.sale_type)+(s.status!=="complete"?" · "+esc(s.status):"")+'</small></td><td>'+usd(s.gross_cents)+'</td><td class="pos">'+usd(s.producer_cents)+'</td></tr>'}).join("")+'</table>':'<small>No sales yet.</small>')+'</div>';
  h+='<div class="card"><h2>Audit log</h2><button class="alt sm" id="aud">Show latest 100 actions</button><div id="audout"></div></div>';
  return h}

/* ---------- audio / filename helpers ---------- */
function clean(n){var b=n.replace(/\.[a-z0-9]+$/i,"").replace(/_/g," "),bpm=(b.match(/(\d{2,3})\s*bpm/i)||[])[1]||"",km=b.match(/(?:^|[^A-Za-z])([A-G][#b]?)\s?(m|min|minor|maj|major)(?![A-Za-z])/i),key=km?km[1].toUpperCase().charAt(0)+km[1].slice(1).toLowerCase()+(/^(m|min|minor)$/i.test(km[2])?"m":" major"):"",tg=[],tm=b.match(/([A-Za-z][A-Za-z0-9 x&'.]{1,40}?)\s+type\s+beat/i);if(tm){tg.push(tm[1].trim().toLowerCase()+" type beat");b=b.replace(tm[0]," ")}
 b=b.replace(/breesmoirabeatz|brees\s*moira|breez\s*moira|\bbm\b/ig," ").replace(/\[[^\]]*\]/g," ").replace(/\d{2,3}\s*bpm/ig," ").replace(/(^|[^A-Za-z])[A-G][#b]?\s?(m|min|minor|maj|major)(?![A-Za-z])/ig,"$1 ").replace(/\(\s*\)|\(\s*-?\s*([A-Za-z]+)\s*-?\s*\)/g,function(m,w){return w&&w.length>3?" ("+w+") ":" "}).replace(/[\-]+/g," ").replace(/\s+/g," ").replace(/^[\s.\-]+|[\s.\-]+$/g,"");return {t:b||n.replace(/\.[a-z0-9]+$/i,""),bpm:bpm,key:key,tg:tg}}
function clip(file){return file.arrayBuffer().then(function(ab){var C=window.AudioContext||window.webkitAudioContext,ctx=new C();return ctx.decodeAudioData(ab).then(function(buf){ctx.close&&ctx.close();var rate=22050,secs=Math.min(30,buf.duration),n=Math.floor(secs*rate),ch=buf.getChannelData(0),ratio=buf.sampleRate/rate,pcm=new Int16Array(n);for(var i=0;i<n;i++){var v=ch[Math.floor(i*ratio)]||0;if(i>n-rate)v*=(n-i)/rate;pcm[i]=Math.max(-1,Math.min(1,v))*32767}var w=new DataView(new ArrayBuffer(44+n*2));function str(o,t){for(var k=0;k<t.length;k++)w.setUint8(o+k,t.charCodeAt(k))}str(0,"RIFF");w.setUint32(4,36+n*2,true);str(8,"WAVEfmt ");w.setUint32(16,16,true);w.setUint16(20,1,true);w.setUint16(22,1,true);w.setUint32(24,rate,true);w.setUint32(28,rate*2,true);w.setUint16(32,2,true);w.setUint16(34,16,true);str(36,"data");w.setUint32(40,n*2,true);for(var j=0;j<n;j++)w.setInt16(44+j*2,pcm[j],true);return new Blob([w],{type:"audio/wav"})})})}
function put(blob,name,kind,pid){return call(act("upload_url"),{kind:kind,name:name,producer_id:pid}).then(function(u){var fd=new FormData();fd.append("cacheControl","3600");fd.append("",blob,name);return fetch(u.uploadUrl,{method:"PUT",body:fd}).then(function(r){if(!r.ok)throw new Error("Upload failed for "+name);return u.ref})})}
var dol=function(v){v=String(v).replace(/[$,\s]/g,"");return v===""?"":Math.round(parseFloat(v)*100)};

/* ---------- edit / new form ---------- */
function editForm(x){
  var nw=!x;x=x||{status:"draft",tags:[],deliverables:[]};var pid=nw?D.producer.id:x.producer_id,st=store(),seller=isSeller(),locked=x.exclusive_sold;
  var sts=seller?["draft","pending_review"]:STAT,dl=function(c){return c==null?"":(c/100)};
  var h='<h2 style="margin-top:14px">'+(nw?'New beat':'Edit: '+esc(x.title))+'</h2>'+(locked?'<p class="muted"><b>This exclusive is sold.</b> Files, price and rights are locked so the buyer\'s deal is protected. You can still edit the description'+(seller?'':' and internal notes')+'.</p>':'')+
  '<input id="et" value="'+esc(x.title||"")+'" placeholder="Beat title"><div class="row"><input id="ee" inputmode="decimal" placeholder="Exclusive $" value="'+dl(x.exclusive_cents)+'"><input id="el" inputmode="decimal" placeholder="Lease $ (optional)" value="'+dl(x.lease_cents)+'"></div>'+
  '<div class="row"><input id="eg" placeholder="Genre" value="'+esc(x.genre||"")+'"><input id="emd" placeholder="Mood" value="'+esc(x.mood||"")+'"></div><div class="row"><input id="eb" inputmode="numeric" placeholder="BPM" value="'+(x.bpm||"")+'"><input id="ek" placeholder="Key" value="'+esc(x.musical_key||"")+'"></div><input id="etg" placeholder="Tags, comma separated" value="'+esc((x.tags||[]).join(", "))+'">'+
  '<textarea id="ed" rows="3" placeholder="Description">'+esc(x.description||"")+'</textarea><label class="ck"><input type="checkbox" id="eex"'+(x.explicit?' checked':'')+'><span>Explicit</span></label><label class="ck"><input type="checkbox" id="evs"'+(x.has_vocal_samples?' checked':'')+'><span>Contains vocal samples</span></label>'+
  '<textarea id="esd" rows="2" placeholder="Samples / third-party material used, and whether cleared (leave blank if none)">'+esc(x.sample_disclosure||"")+'</textarea><textarea id="erp" rows="3" placeholder="Rights package">'+esc(x.rights_package||RIGHTS)+'</textarea>'+
  '<label class="ck"><input type="checkbox" id="erc"'+(x.rights_confirmed?' checked':'')+'><span>I confirm '+(seller?'I own or am authorized to sell':'POTENT owns or is authorized to sell')+' exclusive rights to this beat.</span></label>'+
  (locked?'':'<label>Full audio file buyers receive'+(nw?'':' (leave empty to keep current)')+'<input id="efd" type="file" accept=".mp3,.wav,.m4a,.flac,.zip"></label><small class="muted">A 30-second preview is made from it automatically if you don\'t pick a separate preview.</small><label>Cover artwork (optional)<input id="efc" type="file" accept="image/*"></label>')+
  (seller?'':'<select id="ep">'+st.producers.filter(function(p){return p.kind!=="seller"||x.producer_id===p.id}).map(function(p){return'<option value="'+p.id+'"'+(p.id===pid?' selected':'')+'>'+esc(p.name)+'</option>'}).join("")+'</select><select id="est">'+sts.map(function(s){return'<option value="'+s+'"'+(x.status===s?' selected':'')+'>'+s.replace("_"," ")+'</option>'}).join("")+'</select><small class="muted">Published = live now. Approved + a date = goes live at that time.</small><input id="epa" type="datetime-local" value="'+(x.publish_at?new Date(new Date(x.publish_at).getTime()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):"")+'"><textarea id="ein" rows="2" placeholder="Internal notes (never shown to buyers)">'+esc(x.internal_notes||"")+'</textarea><label class="ck"><input type="checkbox" id="ea"'+(x.active!==false?' checked':'')+'><span>Visible in the public store</span></label>')+
  '<div class="row">'+(seller?'<button id="esv" data-s="draft">Save draft</button><button id="esv2" data-s="pending_review">Submit for review</button>':'<button id="esv">Save changes</button>')+'</div><div class="err" id="eer"></div>';
  $("ebox").innerHTML=h;
  async function go(forced){
    try{$("eer").textContent="Saving...";
      var body={title:$("et").value,exclusive_cents:dol($("ee").value),lease_cents:dol($("el").value),genre:$("eg").value,mood:$("emd").value,bpm:$("eb").value,key:$("ek").value,tags:$("etg").value.split(",").map(function(t){return t.trim()}).filter(Boolean),description:$("ed").value,explicit:$("eex").checked,has_vocal_samples:$("evs").checked,sample_disclosure:$("esd").value,rights_package:$("erp").value,rights_confirmed:$("erc").checked};
      if(!seller){body.producer_id=$("ep").value;body.status=$("est").value;body.publish_at=$("epa").value?new Date($("epa").value).toISOString():"";body.internal_notes=$("ein").value;body.active=$("ea").checked}else body.status=forced;
      if(!locked){var fd=$("efd").files[0],fc=$("efc").files[0],ppid=seller?D.producer.id:body.producer_id;
        if(fd){$("eer").textContent="Making preview and uploading...";body.preview_url=await put(await clip(fd),"preview-"+fd.name.replace(/\.[a-z0-9]+$/i,"")+".wav","preview",ppid);body.deliver_url=await put(fd,fd.name,"deliver",ppid)}
        if(fc)body.cover_url=await put(fc,fc.name,"cover",ppid)}
      if(!nw)body.id=x.id;
      await call(act(nw?"addbeat":"setbeat"),body);await refresh()}catch(e){$("eer").textContent=e.message}}
  $("esv").onclick=function(){go(this.dataset.s)};if($("esv2"))$("esv2").onclick=function(){go("pending_review")};$("ebox").scrollIntoView()}

function wire(){
  var o=$("out");if(o)o.onclick=out;
  if(mode==="p"){
    $("savepm").onclick=function(){call("savepayout",{method:$("pm").value,handle:$("ph").value}).then(function(j){D=j;show();alert("Saved")}).catch(function(e){alert(e.message)})};
    $("cash").onclick=function(){var code=prompt("Enter the payout code from POTENT:");if(!code)return;if(confirm("Request a payout of "+usd(D.balance.available)+"?"))call("requestpayout",{amount_cents:"all",code:code}).then(function(j){D=Object.assign(D,j);show();alert("Requested. POTENT will pay you and add the confirmation number here.")}).catch(function(e){alert(e.message)})};
  }
  if(isSeller()){$("newb").onclick=function(){editForm(null)}}
  if(isStore()){
    var items=[];
    $("bkf").onchange=function(){var fs=[].slice.call(this.files).sort(function(a,b){return (/\.mp3$/i.test(a.name)?0:1)-(/\.mp3$/i.test(b.name)?0:1)}),seen={};items=[];var skipped=[];fs.forEach(function(f){var c=clean(f.name),k=c.t.toLowerCase();if(f.size>52428800){skipped.push(f.name+" (over 50 MB)");return}if(seen[k]){skipped.push(f.name+" (same title as another file)");return}seen[k]=1;items.push({f:f,t:c.t,bpm:c.bpm,key:c.key,tg:c.tg})});
      $("bklist").innerHTML=items.map(function(x,i){return '<div class="row" style="margin-top:6px"><input data-bt="'+i+'" value="'+esc(x.t+(x.bpm?" ("+x.bpm+" BPM)":""))+'"><small style="flex:0 0 auto">'+Math.round(x.f.size/1048576*10)/10+' MB</small></div>'}).join("")+(skipped.length?'<small>Skipped: '+esc(skipped.join("; "))+'</small>':"");$("bkgo").style.display=items.length?"block":"none";$("bkgo").textContent="Upload "+items.length+" beats to the store"};
    $("bkgo").onclick=async function(){var lease=dol($("bkl").value),ex=dol($("bke").value),ok=0,fail=[],gt=$("bktg").value.split(",").map(function(t){return t.trim()}).filter(Boolean);
      if(ex===""&&lease===""){$("bkerr").textContent="Set an exclusive price first.";return}
      if(!$("bkrc").checked){$("bkerr").textContent="Tick the box confirming POTENT can sell exclusive rights to these beats.";return}
      $("bkgo").disabled=true;
      for(var i=0;i<items.length;i++){var x=items[i],title=$("bklist").querySelector('[data-bt="'+i+'"]').value.trim()||x.t;$("bkerr").textContent="Uploading "+(i+1)+" of "+items.length+": "+title+"...";
        try{var pid=$("bkp").value,cl=await clip(x.f),pv=await put(cl,"preview-"+x.f.name.replace(/\.[a-z0-9]+$/i,"")+".wav","preview",pid),dl=await put(x.f,x.f.name,"deliver",pid);
          await call(act("addbeat"),{producer_id:pid,title:title,lease_cents:lease,exclusive_cents:ex,preview_url:pv,deliver_url:dl,tags:gt.concat(x.tg,x.bpm?[x.bpm+" bpm"]:[],x.key?[x.key.toLowerCase()]:[]),bpm:x.bpm,key:x.key,genre:$("bkgn").value,mood:$("bkmd").value,rights_confirmed:true,rights_package:$("bkrp").value,status:$("bkpub").checked?"published":"draft"});ok++}catch(e){fail.push(title+": "+e.message)}}
      $("bkgo").disabled=false;var msg="Done. "+ok+" added."+(fail.length?" Failed: "+fail.join("; "):"");await refresh();$("bkerr").textContent=msg};
    [].forEach.call(document.querySelectorAll("[data-eb]"),function(b){b.onclick=function(){editForm(store().beats[+b.dataset.eb])}});
    [].forEach.call(document.querySelectorAll("[data-rl]"),function(b){b.onclick=function(){if(confirm("Put this beat back to draft so it can be sold again? Only do this after the refund was resolved."))call("o_relist",{id:b.dataset.rl}).then(refresh).catch(function(e){alert(e.message)})}});
  }
  if(isSeller()){[].forEach.call(document.querySelectorAll("[data-eb]"),function(b){b.onclick=function(){editForm(D.beats[+b.dataset.eb])}})}
  if(mode==="o"){
    $("mk").onclick=function(){$("cerr").textContent="";call("o_create",{password:$("cpw").value,name:$("cn").value,email:$("ce").value,country:$("cc").value,lease_pct:$("cl").value,exclusive_pct:$("cx").value}).then(function(j){var html='<p><b>Created.</b> Send them this login:<br>Email: <b>'+esc(j.producer.email)+'</b><br>Temporary password: <b>'+esc(j.tempPassword)+'</b><br><small>Shown once. They sign in at /beatman/ and should change it.</small></p>';return loadAll().then(function(){$("cout").innerHTML=html})}).catch(function(e){$("cerr").textContent=e.message})};
    [].forEach.call(document.querySelectorAll("[data-paid]"),function(b){b.onclick=function(){var r=prompt("After you send the money, enter the confirmation / transaction number:");if(r)call("o_markpaid",{id:b.dataset.paid,reference:r}).then(refresh).catch(function(e){alert(e.message)})}});
    [].forEach.call(document.querySelectorAll("[data-cx]"),function(b){b.onclick=function(){if(confirm("Cancel this payout and return the money to the wallet?"))call("o_cancelpayout",{id:b.dataset.cx}).then(refresh).catch(function(e){alert(e.message)})}});
    [].forEach.call(document.querySelectorAll("[data-pw]"),function(b){b.onclick=function(){if(confirm("Reset this producer's password?"))call("o_resetpw",{id:b.dataset.pw}).then(function(j){alert("New temporary password: "+j.tempPassword)}).catch(function(e){alert(e.message)})}});
    [].forEach.call(document.querySelectorAll("[data-sp]"),function(b){b.onclick=function(){var l=prompt("Producer % on LEASE sales (0-100):");if(l===null)return;var x=prompt("Producer % on EXCLUSIVE sales (0-100):");if(x===null)return;call("o_setproducer",{id:b.dataset.sp,lease_pct:l,exclusive_pct:x}).then(refresh).catch(function(e){alert(e.message)})}});
    [].forEach.call(document.querySelectorAll("[data-adj]"),function(b){b.onclick=function(){var v=prompt("Amount in dollars (use a minus sign to take money out). Example: 250 for a referral bonus:");if(v===null)return;var cents=Math.round(parseFloat(String(v).replace(/[$,]/g,""))*100);var n=prompt("Note (what is this for?)","Referral bonus")||"";call("o_adjust",{id:b.dataset.adj,amount_cents:cents,note:n,kind:/bonus|referral/i.test(n)?"bonus":"adjustment"}).then(refresh).catch(function(e){alert(e.message)})}});
    [].forEach.call(document.querySelectorAll("[data-sa]"),function(b){b.onclick=function(){var p=D.producers.filter(function(z){return z.id===b.dataset.sa})[0];if(confirm((p.store_admin?"Remove":"Give")+" store admin access "+(p.store_admin?"from ":"to ")+p.name+"? Store admins can upload, edit and publish beats. They can never move money."))call("o_setproducer",{id:p.id,store_admin:!p.store_admin}).then(refresh).catch(function(e){alert(e.message)})}});
    [].forEach.call(document.querySelectorAll("[data-vf]"),function(b){b.onclick=function(){var p=D.producers.filter(function(z){return z.id===b.dataset.vf})[0];call("o_setproducer",{id:p.id,verified:!p.verified}).then(refresh).catch(function(e){alert(e.message)})}});
    [].forEach.call(document.querySelectorAll("[data-ap]"),function(b){b.onclick=function(){var x=prompt("What % of each EXCLUSIVE sale does this seller earn? (0-100)");if(x===null)return;call("o_appdecide",{id:b.dataset.ap,decision:"approve",exclusive_pct:x}).then(function(j){return loadAll().then(function(){$("apout").innerHTML='<p><b>Approved.</b> Send '+esc(j.email)+' this login:<br>Temporary password: <b>'+esc(j.tempPassword)+'</b> (shown once). They sign in at /beatman/.</p>'})}).catch(function(e){alert(e.message)})}});
    [].forEach.call(document.querySelectorAll("[data-rj]"),function(b){b.onclick=function(){var n=prompt("Reason (optional):")||"";call("o_appdecide",{id:b.dataset.rj,decision:"reject",note:n}).then(refresh).catch(function(e){alert(e.message)})}});
    $("pcs").onclick=function(){call("o_setcode",{code:$("pcn").value,old_code:$("pco")?$("pco").value:""}).then(function(){alert("Payout code saved.");refresh()}).catch(function(e){alert(e.message)})};
    $("rmv").onclick=function(){$("rme").textContent="";call("o_setmodel",{stream:$("rms").value,artist_pct:$("rma").value,producer_pct:$("rmp").value,platform_pct:$("rml").value,public_text:$("rmt").value,confirmed:$("rmc").checked}).then(function(){$("rme").textContent="Saved.";refresh()}).catch(function(e){$("rme").textContent=e.message})};
    $("aud").onclick=function(){call("o_audit").then(function(j){$("audout").innerHTML='<table>'+j.rows.map(function(r){return'<tr><td>'+new Date(r.created_at).toLocaleString()+'</td><td>'+esc(r.actor)+'</td><td>'+esc(r.action)+'<br><small>'+esc(r.target||"")+'</small></td></tr>'}).join("")+'</table>'}).catch(function(e){alert(e.message)})};
  }
}
try{var s=JSON.parse(sessionStorage.getItem("bm")||"null");if(s&&s.t){tok=s.t;mode=s.m;loadAll().catch(function(){out()})}}catch(e){}
</script>
